<title>Quest Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Quest Deck: iOS-native look. SF Pro on Apple devices (Inter elsewhere), system colours, inset grouped lists, large titles, translucent tab bar.
   Idea: open tasks are the vivid, glowing things on the page; done tasks go quiet. Every open task shows the screen time it will earn. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --sunk:#ececf0; --ink:#111113; --muted:#6b6b70; --faint:#b4b4ba; --line:#dcdce1;
  --accent:#007aff; --accent-ink:#ffffff;
  --pink:#ff2d55; --orange:#ff9500; --green:#34c759; --blue:#007aff; --purple:#af52de; --teal:#30b0c7;
  --danger:#d70015; --warn:#b25000; --ok:#1e8e3e; --gold:#ff9500; --coin:#ff9500;
  --c1:#007aff; --c2:#ff2d55; --c3:#34c759; --c4:#ff9500; --c5:#af52de; --c6:#30b0c7;
  --work:#007aff; --personal:#34c759; --ministry:#af52de;
  --shadow:0 .5px 0 rgba(0,0,0,.04);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --sunk:#2c2c2e; --ink:#ffffff; --muted:#98989f; --faint:#58585d; --line:#38383a;
  --accent:#0a84ff; --pink:#ff375f; --orange:#ff9f0a; --green:#30d158; --blue:#0a84ff; --purple:#bf5af2; --teal:#40cbe0;
  --danger:#ff6961; --warn:#ffb340; --ok:#30d158; --gold:#ff9f0a; --coin:#ff9f0a;
  --c1:#0a84ff; --c2:#ff375f; --c3:#30d158; --c4:#ff9f0a; --c5:#bf5af2; --c6:#40cbe0;
  --work:#0a84ff; --personal:#30d158; --ministry:#bf5af2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --sunk:#2c2c2e; --ink:#ffffff; --muted:#98989f; --faint:#58585d; --line:#38383a;
  --accent:#0a84ff; --pink:#ff375f; --orange:#ff9f0a; --green:#30d158; --blue:#0a84ff; --purple:#bf5af2; --teal:#40cbe0;
  --danger:#ff6961; --warn:#ffb340; --ok:#30d158; --gold:#ff9f0a; --coin:#ff9f0a;
  --c1:#0a84ff; --c2:#ff375f; --c3:#30d158; --c4:#ff9f0a; --c5:#bf5af2; --c6:#40cbe0;
  --work:#0a84ff; --personal:#30d158; --ministry:#bf5af2; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.29 var(--f-body);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-radius:8px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.app{max-width:680px;margin:0 auto;display:grid;gap:12px}
@media (min-width:900px){
  body{padding-top:0;padding-bottom:48px;padding-left:0;padding-right:0}
  .app{max-width:none;margin:0;grid-template-columns:260px minmax(0,1fr);gap:0;min-height:100vh;align-items:start}
  main{max-width:680px;width:100%;margin:0 auto;padding:44px 32px 0}
}

/* ---------- navigation ---------- */
.brand{display:flex;align-items:center;gap:8px;font:600 15px var(--f-display);color:var(--muted);letter-spacing:-.01em}
.brand .mark{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center}
.brand .mark svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rail{display:grid;gap:8px}
.rail .brand-row{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.rail .sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--green)}.dot.warn{background:var(--orange)}
nav.tabs button{border:0;background:none;display:flex;align-items:center;color:var(--muted);font-weight:500;position:relative}
nav.tabs .count{font:600 12px var(--f-body);background:var(--sunk);color:var(--muted);padding:1px 7px;border-radius:99px;min-width:20px;text-align:center}
nav.tabs .count.hot{background:var(--pink);color:#fff}

@media (max-width:899px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
    background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
    border-top:.5px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;font-size:10px;font-weight:500;padding:4px 2px;flex:1;letter-spacing:.01em}
  nav.tabs button .ico{width:25px;height:25px;stroke-width:1.7}
  nav.tabs button[aria-current="page"]{color:var(--accent)}
  nav.tabs button[aria-current="page"] .ico{stroke-width:2.1}
  nav.tabs .count{position:absolute;top:0;left:calc(50% + 6px);font-size:11px;padding:0 5px;min-width:17px;line-height:17px;border:2px solid var(--surface);box-sizing:content-box}
}
@media (min-width:900px){
  .rail{position:sticky;top:0;height:100vh;padding:28px 14px;align-content:start;gap:22px;background:color-mix(in srgb,var(--surface) 70%,transparent);border-right:.5px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  .rail .brand-row{padding:0 10px;flex-direction:column;align-items:flex-start;gap:6px}
  .brand{font-size:17px;color:var(--ink)}
  .brand .mark{width:26px;height:26px;border-radius:7px}
  nav.tabs{display:grid;gap:2px}
  nav.tabs button{gap:11px;padding:8px 10px;border-radius:9px;font-size:16px;text-align:left}
  nav.tabs button .ico{color:var(--accent);stroke-width:1.8}
  nav.tabs button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
  nav.tabs button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);font-weight:600}
  nav.tabs .count{margin-left:auto}
}

/* ---------- large title ---------- */
.lt{padding:6px 4px 2px;display:grid;gap:2px}
.lt-eyebrow{font:600 13px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lt h1{font:700 34px/1.1 var(--f-display);letter-spacing:-.022em}

/* ---------- hero: ring + screen-time bank ---------- */
.hud{background:var(--surface);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center}
.ring{position:relative;width:92px;height:92px;grid-row:1}
.ring svg{width:92px;height:92px;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:11}
.ring .trk{stroke:var(--sunk)}
.ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .9s var(--spring);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--pink) 45%,transparent))}
.ring.closed .val{stroke:var(--green);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--green) 50%,transparent))}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .num b{font:700 24px var(--f-round)}
.ring .num small{display:none}
.ring.closed .num{color:var(--green)}
.ring.closed .num .ico{width:34px;height:34px;stroke-width:3}
.hud-main{display:grid;gap:3px;min-width:0}
.hud-label{font:600 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bank{display:flex;align-items:baseline;gap:5px;font-family:var(--f-round);line-height:1}
.bank b{font-size:46px;font-weight:700;letter-spacing:-.03em}
.bank span{font-size:17px;font-weight:600;color:var(--muted)}
.hud-line{font-size:15px;color:var(--muted);line-height:1.3}
.hud-line b{color:var(--ink);font-weight:600}
.hud-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:14px;border-top:.5px solid var(--line)}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);font-weight:500}
.stat .ico{width:18px;height:18px}
.stat b{color:var(--ink);font-weight:700}
.flame{color:var(--muted)}.flame.lit{color:var(--orange)}.flame.lit .ico{fill:currentColor}.flame.risk{color:var(--danger)}
.spend{border:0;background:var(--accent);color:#fff;font:600 15px var(--f-body);padding:9px 18px;border-radius:99px;display:inline-flex;align-items:center;gap:7px;transition:transform .2s var(--spring)}
.spend:active{transform:scale(.94)}
.spend .ico{width:16px;height:16px;stroke-width:2.4}
.hud.live{background:var(--accent);color:#fff}
.hud.live .hud-label,.hud.live .hud-line,.hud.live .bank span{color:rgba(255,255,255,.78)}
.hud.live .hud-line b,.hud.live .stat b{color:#fff}
.hud.live .hud-foot{border-color:rgba(255,255,255,.28)}
.hud.live .stat{color:rgba(255,255,255,.85)}
.hud.live .ring .trk{stroke:rgba(255,255,255,.25)}
.hud.live .ring .val{stroke:#fff;filter:none}
.hud.live .spend{background:#fff;color:var(--accent)}

/* ---------- category: iOS segmented control ---------- */
.cats{display:flex;background:var(--sunk);border-radius:9px;padding:2px;gap:0}
.cat{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;font-size:14px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0;white-space:nowrap;transition:background .2s,box-shadow .2s}
.cat i{display:none}
.cat[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 .5px 1px rgba(0,0,0,.1)}
.cat .n{font-size:12px;font-weight:600;color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cat[aria-pressed="true"]{background:#636366}}
:root[data-theme="dark"] .cat[aria-pressed="true"]{background:#636366}

/* ---------- capture ---------- */
.capture{display:grid;gap:6px;position:relative}
.capture form{position:relative;display:block}
.capture input{width:100%;border:0;background:var(--surface);border-radius:12px;padding:13px 52px 13px 16px;font-size:17px;outline:none;transition:box-shadow .2s}
.capture input::placeholder{color:var(--faint)}
.capture input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.capture .btn.primary{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border-radius:50%;justify-content:center}
.capture .btn.primary .ico{width:18px;height:18px;stroke-width:2.6}
.preview{font-size:13px;color:var(--accent);min-height:0;padding:0 4px}
.preview:empty{display:none}
.hint{font-size:12px;color:var(--muted);display:none;flex-wrap:wrap;gap:4px 8px;padding:8px 10px;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--surface);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.12);pointer-events:none}
.capture:focus-within .hint{display:flex}
.hint code,.empty-note code{font:500 12px var(--f-mono);background:var(--sunk);padding:2px 7px;border-radius:6px;color:var(--ink)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--sunk);color:var(--accent);transition:transform .2s var(--spring),opacity .15s}
.btn:active{transform:scale(.96)}
.btn .ico{width:18px;height:18px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.btn.ghost{background:none;color:var(--muted);padding:8px 6px;font-weight:500}
.btn.sm{padding:6px 14px;font-size:14px;border-radius:99px;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.btn.sm.primary{background:var(--accent);color:#fff}

/* ---------- sections ---------- */
main{display:grid;gap:16px;min-width:0;align-content:start}
section{display:grid;gap:8px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.sec-head h2{font:700 22px var(--f-display);letter-spacing:-.02em}
.sec-head .sub{font-size:15px;color:var(--muted)}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* heads-up */
.radar{display:grid;background:var(--surface);border-radius:var(--r);overflow:hidden}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;position:relative}
.alert+.alert::before{content:"";position:absolute;top:0;left:34px;right:0;height:.5px;background:var(--line)}
.alert::after{content:"";order:-1;width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--muted) 16%,transparent)}
.alert.critical::after{background:var(--pink);box-shadow:0 0 0 4px color-mix(in srgb,var(--pink) 18%,transparent)}
.alert.warning::after{background:var(--orange);box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 20%,transparent)}
.alert.info::after{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.alert .tag,.alert .msg small{display:none}
.alert .msg{flex:1;min-width:0;font-size:16px;font-weight:500}
.allclear{background:var(--surface);border-radius:var(--r);padding:14px 16px;color:var(--ok);font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center}

/* must-wins */
.wins{display:grid;gap:8px;grid-template-columns:1fr}
.win{background:var(--surface);border-radius:var(--r);padding:4px 0;display:grid;position:relative;overflow:hidden}
.win::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--orange)}
.win .slot{display:none}
.win.won::before{background:var(--green)}

/* ---------- tasks ---------- */
.list{display:grid;background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 12px 12px 14px;position:relative;transition:background .15s}
.row+.row::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--line)}
.win .row::before{display:none}
.row:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.check{--pc:var(--blue);width:26px;height:26px;border-radius:50%;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 12%,transparent);flex:none;margin-top:0;display:grid;place-items:center;padding:0;color:transparent;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 35%,transparent);transition:background .2s,transform .25s var(--spring),box-shadow .3s}
.check.p1{--pc:var(--pink)}.check.p2{--pc:var(--orange)}
.check:hover{background:color-mix(in srgb,var(--pc) 24%,transparent);box-shadow:0 0 0 5px color-mix(in srgb,var(--pc) 16%,transparent)}
.check:active{transform:scale(.82)}
.check .ico{width:14px;height:14px;stroke-width:3.4}
.row.done .check{background:var(--green);border-color:var(--green);color:#fff;animation:pop .45s var(--spring)}
.row.done .title{color:var(--faint)}
.row.done{background:none}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.body{flex:1;min-width:0;display:grid;gap:3px}
.title{background:none;border:0;padding:0;text-align:left;font-size:17px;font-weight:400;line-height:1.3;overflow-wrap:anywhere;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:13px;color:var(--muted);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ico{width:13px;height:13px}
.meta .late{color:var(--danger);font-weight:600}.meta .soon{color:var(--warn);font-weight:600}
.meta .gain{color:var(--ok);font-weight:700;background:color-mix(in srgb,var(--green) 16%,transparent);padding:1px 8px;border-radius:99px}
.row.done .meta .gain{background:none;color:var(--muted);font-weight:600;padding:0}
.pdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.acts{display:flex;gap:0;flex:none;margin:-4px -4px -4px 0}
.ib{border:0;background:none;color:var(--faint);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:color .15s,background .15s}
.ib .ico{width:19px;height:19px}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib.on{color:var(--orange)}.ib.on .ico{fill:currentColor}
.ib.today.on{color:var(--accent)}
.ib.resched{color:var(--pink);background:color-mix(in srgb,var(--pink) 12%,transparent)}
.seg{row-gap:8px}
.tier{font:600 12px var(--f-body)}
.empty-note{background:var(--surface);border-radius:var(--r);padding:16px;color:var(--muted);font-size:15px;line-height:1.45}
.empty-note b{color:var(--ink)}
.empty-note.solid{border:0}

/* ---------- projects ---------- */
.bosses{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.boss{--pc:var(--accent);background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:12px;text-align:left;border:0;transition:transform .2s var(--spring)}
.boss:active{transform:scale(.98)}
.boss h3{font:600 18px var(--f-display);letter-spacing:-.015em}
.boss .area{font:600 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--muted)}
.hp{display:grid;gap:6px}
.hp .bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hp .bar i{display:block;height:100%;background:var(--pc);border-radius:99px;transition:width .6s var(--spring)}
.hp .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.health{font:600 12px var(--f-body);padding:3px 10px;border-radius:99px;justify-self:start}
.health.ok{color:var(--ok);background:color-mix(in srgb,var(--green) 16%,transparent)}
.health.warning{color:var(--warn);background:color-mix(in srgb,var(--orange) 16%,transparent)}
.health.critical{color:var(--danger);background:color-mix(in srgb,var(--pink) 14%,transparent)}
.health.info{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.boss .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1;min-width:0;border:0;background:var(--surface);border-radius:12px;padding:12px 14px;outline:none}
.back{border:0;background:none;color:var(--accent);font-weight:500;font-size:17px;padding:0;display:inline-flex;gap:2px;align-items:center;justify-self:start}
.back .ico{width:22px;height:22px;margin-left:-6px}
.groupname{display:flex;align-items:center;gap:8px;font:600 15px var(--f-display);margin-top:4px;color:var(--muted)}
.groupname i{width:9px;height:9px;border-radius:50%}

/* ---------- upcoming ---------- */
.day{display:grid;gap:6px}
.day h3{font:500 14px var(--f-body);color:var(--muted);display:flex;gap:8px;align-items:baseline;padding:0 4px}
.day h3 b{color:var(--ink);font:700 20px var(--f-display);letter-spacing:-.02em}
.marker{font-size:14px;color:var(--warn);padding:9px 14px;background:color-mix(in srgb,var(--orange) 12%,var(--surface));border-radius:10px}
.marker.deadline{color:var(--danger);background:color-mix(in srgb,var(--pink) 10%,var(--surface));font-weight:600}

/* ---------- report ---------- */
.report{background:var(--surface);border-radius:20px;padding:20px;display:grid;gap:16px}
.report .verdict{font:700 24px/1.2 var(--f-display);letter-spacing:-.02em}
.report .verdict-sub{color:var(--muted);font-size:15px;margin-top:4px}

<script>
const ICON={

  flame:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 2.5c1 4 5.5 6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.2 1-3.8 2.2-4.8 0 2 1 3.2 2.2 3.4-1-3.2 0-6.4 1.1-9.6z"/></svg>',

  repeat:'<svg class="ico" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  clock:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  wait:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M7 2c0 5 10 5 10 10S7 17 7 22M17 2c0 5-10 5-10 10s10 5 10 10"/></svg>',
  today:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  inbox:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>',
  boss:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>',
  cal:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>',
  review:'<svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  moon:'<svg class="ico" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  gift:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8S10 3 7.5 4 9 8 12 8zm0 0s2-5 4.5-4S15 8 12 8z"/></svg>',
  ticket:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 0 4v5h18v-5a2 2 0 0 1 0-4V4H3z"/><path d="M14 4v13"/></svg>',
  sound:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>',
  mute:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>',
  right:'<svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  left:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>'
};
const VIEWS=[['today','Today',ICON.today],['inbox','Inbox',ICON.inbox],['projects','Projects',ICON.boss],['upcoming','Upcoming',ICON.cal],['review','Review',ICON.review]];
const CATS=['Work','Personal','Ministry'];
const CATVAR={Work:'--work',Personal:'--personal',Ministry:'--ministry'};
const COLORS=['c1','c2','c3','c4','c5','c6'];
const SIZE={S:'Small',M:'Medium',L:'Large'};
const TIERS={common:'Common',rare:'Rare',epic:'Epic',legendary:'Legendary'};
const TIERVAR={common:'--accent',rare:'--accent',epic:'--purple',legendary:'--orange'};
const TIERRANK={common:0,rare:1,epic:2,legendary:3};
const KINDS=[['meeting','Meeting'],['call','Call'],['online','Online'],['outside','Out & about'],['focus','Deep work'],['home','At home']];
const KINDL=Object.fromEntries(KINDS);
const DURS=[15,30,45,60,90,120,180];
const fmtTime=hm=>{if(!hm)return'';const[h,m]=hm.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}).replace(/\s/g,'\u202f').toLowerCase()};
const fmtDur=m=>m>=60?(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${Math.floor(m/60)}h`):`${m}m`;
// a booked slot is stored as local date + time ("due" + "at") and as a UTC instant ("startAt"), which the calendar feed turns into a timed event
function stampStart(t){if(t.at&&t.due){const d=new Date(`${t.due}T${t.at}:00`);if(!isNaN(d)){t.startAt=d.toISOString();t.dur=t.dur||30;return t}}t.startAt=null;return t}
const isMissed=t=>!!t.startAt&&t.status!=='done'&&t.status!=='someday'&&t.status!=='inbox'&&Date.parse(t.startAt)+(t.dur||30)*60000<Date.now();
const COMBO_MIN=30;
const BASE_MIN={S:5,M:10,L:20};
const fmtMin=n=>n>=60?`${Math.floor(n/60)}h ${n%60}m`:`${n} min`;
const bankHtml=n=>n>=60?`<b>${Math.floor(n/60)}</b><span>h</span><b>${n%60}</b><span>m</span>`:`<b>${n}</b><span>min</span>`;
const RECURS=[['','Never'],['daily','Every day'],['weekdays','Weekdays (Mon–Fri)'],['weekly','Every week'],['biweekly','Every 2 weeks'],['monthly','Every month'],['custom','On specific days']];
const DOWS=['sun','mon','tue','wed','thu','fri','sat'];
const DOWL=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const DEFAULT_REWARDS=[{id:'r1',name:'Social media',cost:15},{id:'r2',name:'Games',cost:30}];

const S={projects:{},tasks:{},meta:{},mode:'connecting',db:null,view:'today',area:'All',openProject:null,showReport:false,coach:null};
try{const a=localStorage.getItem('qd-area');if(a&&(a==='All'||CATS.includes(a)))S.area=a}catch{}
let soundOn=true;try{soundOn=localStorage.getItem('qd-sound')!=='off'}catch{}
const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h;

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const weekStart=(s=today())=>{const k=(parseYmd(s).getDay()+6)%7;return addDays(s,-k)};
const fmtDate=s=>parseYmd(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
function dueLabel(due){const n=diffDays(due,today());
  if(n<0)return{t:(-n)+'d late',c:'late'};if(n===0)return{t:'Today',c:'soon'};if(n===1)return{t:'Tomorrow',c:'soon'};
  if(n<7)return{t:parseYmd(due).toLocaleDateString(undefined,{weekday:'short'}),c:''};
  return{t:parseYmd(due).toLocaleDateString(undefined,{month:'short',day:'numeric'}),c:''}}
const isoDay=iso=>iso?ymd(new Date(iso)):null;

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const tasks=()=>Object.values(S.tasks);
const openTasks=()=>tasks().filter(t=>t.status!=='done');
const projects=()=>Object.values(S.projects).filter(p=>!p.archived).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const warnOf=t=>t.warn!=null&&t.warn!==''?+t.warn:({1:7,2:3,3:1}[t.priority||3]);
const projOf=t=>t.projectId?S.projects[t.projectId]:null;
const catOfProject=p=>CATS.includes(p?.area)?p.area:null;
const catOf=t=>catOfProject(projOf(t))||(CATS.includes(t.cat)?t.cat:null);
const inArea=t=>S.area==='All'||catOf(t)===S.area;
const pInArea=p=>S.area==='All'||catOfProject(p)===S.area;
const catDot=c=>c?`<i class="pdot" style="background:var(${CATVAR[c]})"></i>`:'';
const matchCat=w=>CATS.find(c=>c.toLowerCase().startsWith(w.toLowerCase()))||null;

function findProject(word){const w=norm(word);if(!w)return null;const ps=projects();
  return ps.find(p=>norm(p.name)===w)||ps.find(p=>norm(p.name).startsWith(w))||ps.find(p=>norm(p.name).includes(w))||null}

/* ---------- recurrence ---------- */
function recurLabel(t){if(!t.recur)return'';if(t.recur==='custom')return 'Every '+(t.recurDays||[]).map(d=>DOWL[d]).join(', ');return(RECURS.find(r=>r[0]===t.recur)||['',''])[1]}
function matchesRecur(t,s){const dw=parseYmd(s).getDay();if(t.recur==='weekdays')return dw>0&&dw<6;if(t.recur==='custom')return(t.recurDays||[]).includes(dw);return true}
function nextDue(t){const td=today();const base=t.due&&t.due>td?t.due:td;
  if(t.recur==='daily')return addDays(base,1);if(t.recur==='weekly')return addDays(base,7);if(t.recur==='biweekly')return addDays(base,14);
  if(t.recur==='monthly'){const d=parseYmd(base);d.setMonth(d.getMonth()+1);return ymd(d)}
  for(let i=1;i<=7;i++){const x=addDays(base,i);if(matchesRecur(t,x))return x}return addDays(base,7)}
function firstDue(t){const td=today();if(t.recur==='weekdays'||t.recur==='custom'){for(let i=0;i<7;i++){const x=addDays(td,i);if(matchesRecur(t,x))return x}}return td}

/* ---------- quick add parser ---------- */
function parseQuick(text){
  let t=' '+text+' ';const o={priority:3,size:'M'};const td=today();
  t=t.replace(/\s\+(\w+)(?=\s)/g,(m,w)=>{const c=matchCat(w);if(c){o.cat=c;return ' '}return m});
  t=t.replace(/\s#([\w-]+)/g,(m,w)=>{const p=findProject(w);if(p)o.projectId=p.id;else o.newProject=w.replace(/[-_]/g,' ');return ' '});
  t=t.replace(/\s!([123])(?=\s)/g,(m,n)=>{o.priority=+n;return ' '});
  t=t.replace(/\s\*([sml])(?=\s)/gi,(m,z)=>{o.size=z.toUpperCase();return ' '});
  t=t.replace(/\s@wait(ing)?(?=\s)/gi,()=>{o.status='waiting';return ' '});
  t=t.replace(/\s@(meeting|meet|call|online|zoom|outside|out|errand|focus|deep|home)(?=\s)/gi,(m,k)=>{k=k.toLowerCase();o.kind={meet:'meeting',zoom:'online',out:'outside',errand:'outside',deep:'focus'}[k]||k;return ' '});
  t=t.replace(/\s(?:for\s)?(\d{1,3})\s?(min|mins|m|h|hr|hrs|hour|hours)(?=\s)(?!\s*(?:left|late))/gi,(m,n,u)=>{const v=u[0].toLowerCase()==='h'?+n*60:+n;if(v>=5&&v<=480){o.dur=v;return ' '}return m});
  t=t.replace(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)(?=\s)/i,(m,h,mi,ap)=>{h=+h%12+(ap.toLowerCase()==='pm'?12:0);o.at=pad(h)+':'+(mi||'00');return ' '});
  t=t.replace(/\s(?:at\s)?([01]?\d|2[0-3]):([0-5]\d)(?=\s)/,(m,h,mi)=>{o.at=pad(+h)+':'+mi;return ' '});
  t=t.replace(/\severy((?:[\s,]+(?:and\s+)?(?:sun|mon|tue|wed|thu|fri|sat)[a-z]*)+)(?=\s)/i,(m,days)=>{
    const ds=[...new Set((days.toLowerCase().match(/sun|mon|tue|wed|thu|fri|sat/g)||[]).map(d=>DOWS.indexOf(d)))].sort();o.recur='custom';o.recurDays=ds;return ' '});
  t=t.replace(/\s(every\s?day|daily|weekdays|every\s?weekday|every\s?2\s?weeks|biweekly|every\s?other\s?week|every\s?week|weekly|every\s?month|monthly)(?=\s)/i,(m,w)=>{const x=w.toLowerCase().replace(/\s/g,'');
    o.recur=x.includes('weekday')?'weekdays':x.includes('2')||x.includes('other')||x==='biweekly'?'biweekly':x.includes('day')||x==='daily'?'daily':x.includes('month')?'monthly':'weekly';return ' '});
  const setDue=d=>{o.due=d;return ' '};
  t=t.replace(/\s(\d{4}-\d{2}-\d{2})(?=\s)/,(m,d)=>setDue(d));
  t=t.replace(/\s(today|tod|tonight)(?=\s)/i,()=>setDue(td));
  t=t.replace(/\s(tomorrow|tmr|tmrw)(?=\s)/i,()=>setDue(addDays(td,1)));
  t=t.replace(/\snext week(?=\s)/i,()=>{const k=(parseYmd(td).getDay()+6)%7;return setDue(addDays(td,7-k))});
  t=t.replace(/\sin (\d+) ?(d|days?|w|wks?|weeks?)(?=\s)/i,(m,n,u)=>setDue(addDays(td,+n*(u[0].toLowerCase()==='w'?7:1))));
  t=t.replace(/\s(?:on |by )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*(?=\s)/i,(m,d)=>{const target=DOWS.indexOf(d.toLowerCase());let n=(target-parseYmd(td).getDay()+7)%7;if(n===0)n=7;return setDue(addDays(td,n))});
  t=t.replace(/\s(?:on |by )?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]* (\d{1,2})(?=\s)/i,(m,mo,d)=>{const now=new Date();let dt=new Date(now.getFullYear(),MONTHS.indexOf(mo.toLowerCase()),+d);if(ymd(dt)<td)dt.setFullYear(dt.getFullYear()+1);return setDue(ymd(dt))});
  o.title=t.trim().replace(/\s+/g,' ');
  if(o.at&&!o.due){const nowHm=pad(new Date().getHours())+':'+pad(new Date().getMinutes());o.due=o.at>nowHm?td:addDays(td,1)}
  if(o.recur&&!o.due)o.due=firstDue(o);
  if(o.at)stampStart(o);
  if(!o.status)o.status=(o.projectId||o.newProject||o.due||o.cat)?'next':'inbox';
  return o}

/* ---------- persistence ---------- */
const queues={};
function queue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn).catch(e=>{
  toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete some old projects or tasks, then try again.':'Could not save that change. Check your connection and try again.')});queues[path]=p;return p}
const local={load(){try{return JSON.parse(localStorage.getItem('qd-local')||'null')}catch{return null}},
  save(){try{localStorage.setItem('qd-local',JSON.stringify({projects:S.projects,tasks:S.tasks,meta:S.meta}))}catch{}}};
function persist(col,id,obj){if(!S.db){local.save();return}const body={...obj};delete body.id;const path=col+'/'+id;queue(path,()=>S.db.doc(path).set(body))}
function persistDel(col,id){if(!S.db){local.save();return}const path=col+'/'+id;queue(path,()=>S.db.doc(path).delete())}
function saveTask(t){S.tasks[t.id]={...t};persist('tasks',t.id,t);render()}
function deleteTask(id){delete S.tasks[id];persistDel('tasks',id);render()}
function saveProject(p){S.projects[p.id]={...p};persist('projects',p.id,p);render()}
function deleteProject(id){delete S.projects[id];persistDel('projects',id);render()}
function saveMeta(patch){S.meta={...S.meta,...patch};if(!S.db){local.save()}else{const m={...S.meta};queue('meta/state',()=>S.db.doc('meta/state').set(m))}render()}

/* ---------- motivation engine ---------- */
// Every finished task earns minutes of screen time (5 / 10 / 20 by size). Some also drop a surprise bonus of 5, 10 or 15 minutes.
function rollOnce(){const r=Math.random();
  if(r<.03)return{tier:'legendary',tokens:15};
  if(r<.10)return{tier:'epic',tokens:10};
  if(r<.28)return{tier:'rare',tokens:5};
  return{tier:'common',tokens:0}}
function roll(lucky){let a=rollOnce();if(lucky){const b=rollOnce();if(TIERRANK[b.tier]>TIERRANK[a.tier]||(b.tier===a.tier&&b.tokens>a.tokens))a=b}return a}
function comboNow(){const cut=Date.now()-COMBO_MIN*60000;const last=tasks().filter(t=>t.status==='done'&&t.doneAt&&+new Date(t.doneAt)>cut).sort((a,b)=>a.doneAt<b.doneAt?1:-1)[0];
  return last?{n:last.loot?.combo||1,until:+new Date(last.doneAt)+COMBO_MIN*60000}:null}
const comboMult=n=>n>=5?3:n>=3?2:1;

function plannedToday(){const td=today();
  return tasks().filter(t=>(t.mustWinOn===td||t.todayOn===td||(t.due&&t.due<=td&&t.status!=='inbox'&&(t.status!=='done'||isoDay(t.doneAt)===td)))&&(t.status!=='done'||isoDay(t.doneAt)===td))}
function dayNumbers(){const td=today();const planned=plannedToday();const doneToday=tasks().filter(t=>t.status==='done'&&isoDay(t.doneAt)===td);
  const target=Math.max(3,planned.length);return{planned,doneToday,target,closed:doneToday.length>=target}}

function stats(){const done=tasks().filter(t=>t.status==='done');const td=today();
  const byDay={};done.forEach(t=>{const d=isoDay(t.doneAt);if(d)(byDay[d]=byDay[d]||[]).push(t)});
  const days=Object.keys(byDay).sort();
  // "Never miss twice": one empty day is a rest day; two in a row ends the streak.
  let streak=0,miss=0,d=byDay[td]?td:addDays(td,-1);
  if(days.length)while(d>=days[0]){if(byDay[d]){streak++;miss=0}else{miss++;if(miss>=2)break}d=addDays(d,-1)}
  const yesterdayMiss=!byDay[addDays(td,-1)];
  const atRisk=streak>0&&!byDay[td]&&yesterdayMiss;
  const bonus=(S.meta.bonuses||[]);
  const earned=done.reduce((s,t)=>s+(t.loot?.tokens||0),0)+bonus.reduce((s,b)=>s+(b.tokens||0),0);
  const spent=(S.meta.spent||[]).reduce((s,x)=>s+(x.ticket?0:(x.cost||0)),0);
  const tickets=done.filter(t=>t.loot?.ticket).length+bonus.filter(b=>b.ticket).length-(S.meta.spent||[]).filter(x=>x.ticket).length;
  return{streak,atRisk,todayDone:(byDay[td]||[]).length,tokens:earned-spent,tickets,byDay}}

function projectInfo(p){const ts=tasks().filter(t=>t.projectId===p.id);const open=ts.filter(t=>t.status!=='done');const next=open.filter(t=>t.status==='next');
  const stamps=ts.flatMap(t=>[t.createdAt,t.doneAt]).filter(Boolean).concat(p.createdAt||[]).map(isoDay).filter(Boolean).sort();
  const last=stamps[stamps.length-1];const idle=last?diffDays(today(),last):0;
  const left=p.deadline?diffDays(p.deadline,today()):null;
  let health=['On track','ok'];
  if(ts.length&&!open.length)health=['Defeated','info'];
  else if(left!=null&&left<0)health=['Past deadline','critical'];
  else if(left!=null&&open.length>Math.max(1,left))health=['At risk','critical'];
  else if(!next.length)health=['No next step','warning'];
  else if(idle>=7)health=['Stalled '+idle+'d','warning'];
  return{ts,open,next,idle,left,health}}

function radar(){const td=today();const items=[];
  openTasks().filter(inArea).forEach(t=>{
    if(isMissed(t)&&t.due===td)items.push({sev:'critical',tag:'Missed',msg:`Missed: ${t.title}`,sub:`Was booked for ${fmtTime(t.at)}.`,task:t.id,act:'resched',rank:-1});
    if(t.carried>=2)items.push({sev:'warning',tag:'Avoiding',msg:t.title,sub:`Pushed to tomorrow ${t.carried} times. It is probably too big or unclear. Split it into a 10-minute first step, or drop it.`,task:t.id,rank:.8});
    if(!t.due||t.status==='inbox')return;const n=diffDays(t.due,td);
    if(n<0)items.push({sev:'critical',tag:'Overdue',msg:t.title,sub:`Was due ${fmtDate(t.due)}. Do it, reschedule it, or drop it.`,task:t.id,act:'resched',rank:0+n/1000});
    else if(n<=warnOf(t)&&n>0&&t.todayOn!==td&&t.mustWinOn!==td&&!t.recur)items.push({sev:'warning',tag:'Heads-up',msg:t.title,sub:`Due ${fmtDate(t.due)}, ${n} day${n>1?'s':''} out. Start it now so it is not a last-minute surprise.`,task:t.id,act:'today',rank:1+n/100})});
  openTasks().filter(inArea).filter(t=>t.status==='waiting').forEach(t=>{const since=isoDay(t.waitingSince||t.createdAt);const n=since?diffDays(td,since):0;
    if(n>=4)items.push({sev:'warning',tag:'Follow up',msg:t.title,sub:`Waiting on ${t.waitingOn||'someone'} for ${n} days. Send a nudge.`,task:t.id,rank:2})});
  projects().filter(pInArea).forEach(p=>{const i=projectInfo(p);
    if(i.health[1]==='critical')items.push({sev:'critical',tag:i.health[0],msg:p.name,sub:i.left<0?`Deadline passed ${-i.left}d ago with ${i.open.length} tasks open.`:`${i.open.length} tasks left and ${i.left} days to the deadline.`,project:p.id,rank:.5});
    else if(i.health[0]==='No next step')items.push({sev:'warning',tag:'Stuck',msg:p.name,sub:'No next action. Add the very next physical step.',project:p.id,rank:3});
    else if(i.health[1]==='warning')items.push({sev:'info',tag:'Stalled',msg:p.name,sub:`Nothing moved in ${i.idle} days. Still important? Touch it or archive it.`,project:p.id,rank:4})});
  const inbox=openTasks().filter(t=>t.status==='inbox').length;
  if(inbox>=8)items.push({sev:'info',tag:'Inbox',msg:`${inbox} unsorted items`,sub:'Process the inbox so nothing hides in there.',view:'inbox',rank:5});
  const lr=(S.meta.reviews||[]).slice(-1)[0];const since=lr?diffDays(td,lr):null;
  if(since==null||since>=7)items.push({sev:since==null||since>=10?'warning':'info',tag:'Review',msg:'Weekly review is due',sub:since==null?'Do your first one. It takes 20 minutes and earns 15 bonus minutes.':`Last one was ${since} days ago.`,view:'review',rank:6});
  if(S.area==='All'){const ws=weekStart();const wk=tasks().filter(t=>t.status==='done'&&isoDay(t.doneAt)>=ws);const quiet=CATS.filter(c=>projects().some(p=>p.area===c)&&!wk.some(t=>catOf(t)===c));
    if(wk.length>=5&&quiet.length)items.push({sev:'info',tag:'Balance',msg:`${quiet.join(' and ')} got nothing done this week`,sub:'Pick one small task there for tomorrow so it does not quietly fall apart.',rank:7})}
  return items.sort((a,b)=>a.rank-b.rank)}

/* ---------- sound + haptics ---------- */
let actx=null;
function tone(freqs,dur=.09,gap=.07){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
  freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
    const s=t0+i*gap;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.18,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+dur+.15);o.start(s);o.stop(s+dur+.2)})}catch{}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch{}}
function chestSound(tier,combo){const base=523*Math.pow(1.06,Math.min(combo-1,8));
  if(tier==='common')tone([base,base*1.5]);else if(tier==='rare')tone([base,base*1.25,base*1.5]);
  else if(tier==='epic')tone([base,base*1.25,base*1.5,base*2],.12,.08);else tone([base,base*1.25,base*1.5,base*2,base*2.5,base*3],.16,.09)}

/* ---------- actions ---------- */
function addFromText(text,extra={}){const o=parseQuick(text);if(!o.title)return;
  if(o.newProject){const cat=o.cat||(S.area==='All'?'Personal':S.area);const p={id:'p_'+uid(),name:o.newProject.replace(/\b\w/g,c=>c.toUpperCase()),area:cat,color:COLORS[projects().length%6],createdAt:new Date().toISOString()};saveProject(p);o.projectId=p.id;toast(`New ${cat} project <b>${esc(p.name)}</b> created`)}
  delete o.newProject;
  if(!o.cat&&!o.projectId&&S.area!=='All')o.cat=S.area;
  const t={id:'t_'+uid(),createdAt:new Date().toISOString(),...o,...extra};
  if(extra.projectId&&t.status==='inbox')t.status='next';
  if(t.status==='waiting')t.waitingSince=new Date().toISOString();
  saveTask(t);return t}

function completeTask(id,ev){const t=S.tasks[id];if(!t)return;const prev={...t};const td=today();
  if(t.status==='done'){saveTask({...t,status:t.prevStatus||'next',doneAt:null,loot:null});return}
  const c=comboNow();const combo=c?c.n+1:1;const mult=comboMult(combo);
  const lucky=t.mustWinOn===td||(t.due&&diffDays(t.due,td)>warnOf(t));
  const base=BASE_MIN[t.size]||BASE_MIN.M;const comboBonus=mult>1?(mult-1)*5:0;
  const r=roll(lucky);const loot={tier:r.tier,tokens:base+r.tokens+comboBonus,bonus:r.tokens+comboBonus,ticket:false,combo};
  const ringBefore=dayNumbers().closed;
  saveTask({...t,prevStatus:t.status,status:'done',doneAt:new Date().toISOString(),loot,carried:0});
  let spawned=null;
  if(t.recur){spawned={...t,id:'t_'+uid(),due:nextDue(t),status:'next',createdAt:new Date().toISOString(),todayOn:null,mustWinOn:null,doneAt:null,loot:null,carried:0,resched:0};delete spawned.prevStatus;stampStart(spawned);saveTask(spawned)}
  chestSound(r.tier,combo);buzz(r.tier==='common'?15:[20,40,30]);
  const why=[lucky?(t.mustWinOn===td?'must-win luck':'early-bird luck'):null,mult>1?`combo ×${mult}`:null].filter(Boolean).join(' · ');
  if(r.tokens>0){burst(ev,r.tier!=='rare');showChest(r.tier,r.tokens+comboBonus,false,why)}
  else burst(ev,false);
  toast(`<b>+${loot.tokens} min</b> screen time${combo>1?` · combo ${combo}`:''}${why&&!(r.tokens>0)?' · '+why:''}`,()=>{saveTask(prev);if(spawned)deleteTask(spawned.id)});
  const dn=dayNumbers();
  if(!ringBefore&&dn.closed&&!(S.meta.ringDays||[]).includes(td)){
    const b={at:new Date().toISOString(),tokens:10,ticket:false,why:'Ring closed'};
    saveMeta({ringDays:[...(S.meta.ringDays||[]),td].slice(-60),bonuses:[...(S.meta.bonuses||[]),b]});
    setTimeout(()=>{showChest('epic',b.tokens,b.ticket,'You closed today\'s ring');burst(null,true);tone([523,659,784,1047,1319],.18,.1)},900)}
  const wins=tasks().filter(x=>x.mustWinOn===td);
  if(t.mustWinOn===td&&wins.length>=3&&wins.every(x=>x.status==='done'))setTimeout(()=>toast('<b>All 3 must-wins done.</b> That is what a good day looks like.'),1600)}

function toggleMustWin(id){const t=S.tasks[id];const td=today();
  if(t.mustWinOn===td){saveTask({...t,mustWinOn:null});return}
  const n=tasks().filter(x=>x.mustWinOn===td).length;
  if(n>=3){toast('You already have 3 must-wins today. Unstar one first. Three is the limit on purpose.');return}
  saveTask({...t,mustWinOn:td,todayOn:td,status:t.status==='inbox'?'next':t.status})}
function warnOverlap(n){if(!n.startAt)return;const a=Date.parse(n.startAt),b=a+(n.dur||30)*60000;
  const c=openTasks().find(x=>x.id!==n.id&&x.startAt&&Date.parse(x.startAt)<b&&Date.parse(x.startAt)+(x.dur||30)*60000>a);
  if(c)setTimeout(()=>toast(`Heads-up: that overlaps <b>${esc(c.title)}</b> at ${fmtTime(c.at)}.`),700)}
function reschedule(id,due,at){const t=S.tasks[id];if(!t)return;const n={...t,due,at,resched:(t.resched||0)+1,todayOn:due===today()?due:t.todayOn};stampStart(n);
  closeSheet();saveTask(n);warnOverlap(n);toast(`Rescheduled to <b>${due===today()?'today':fmtDate(due)}${at?' at '+fmtTime(at):''}</b>. Your calendar updates shortly.`)}
function openRescheduleSheet(id){const t=S.tasks[id];if(!t)return;const now=new Date();const td=today();
  const roundUp=(d,step=15)=>{d=new Date(d);d.setMinutes(Math.ceil(d.getMinutes()/step)*step,0,0);return d};
  const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
  const in1=roundUp(new Date(+now+3600000));const opts=[];
  if(ymd(in1)===td)opts.push(['In 1 hour',td,hm(in1)]);
  const eve=new Date(now);eve.setHours(18,0,0,0);if(eve>now&&ymd(eve)===td)opts.push(['This evening, 6:00 pm',td,'18:00']);

    <div class="rewards">${opts.map(([l,d,h])=>`<div class="reward"><span class="name">${l}</span><button type="button" class="btn sm primary" data-act="rs-quick" data-id="${id}" data-d="${d}" data-h="${h}">Pick</button></div>`).join('')}</div>
    <div class="grid2"><div class="field"><label for="rs-date">Another day</label><input type="date" id="rs-date" min="${td}" value="${t.due&&t.due>=td?t.due:tm}"></div>
      <div class="field"><label for="rs-time">Time</label><input type="time" id="rs-time" value="${t.at||'09:00'}"></div></div>
    <div class="foot"><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button><button class="btn primary" type="submit">Reschedule</button></div>
  </form>`)}
function toggleToday(id){const t=S.tasks[id];const td=today();saveTask({...t,todayOn:t.todayOn===td?null:td,status:t.status==='inbox'?'next':t.status})}
function pushTomorrow(id){const t=S.tasks[id];const tm=addDays(today(),1);
  const n={...t,todayOn:tm,mustWinOn:null,carried:(t.carried||0)+1};if(t.due&&t.due<=today())n.due=tm;stampStart(n);saveTask(n)}

function drawHud(){const st=stats();const dn=dayNumbers();const c=comboNow();const sess=S.meta.session;
  const pct=Math.min(1,dn.doneToday.length/dn.target);const R=40,C=2*Math.PI*R;

     <circle class="trk" cx="50" cy="50" r="${R}"/><circle class="val" cx="50" cy="50" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>

  const flame=`<span class="stat flame ${st.todayDone?'lit':st.atRisk?'risk':''}">${ICON.flame}<b>${st.streak}</b> day streak${streakTxt}</span>`;

  el.className='hud';

    <div class="hud-foot">${flame}<button class="spend" data-act="rewards" aria-label="Spend screen time">Spend time${ICON.right}</button></div>`;

function tickCombo(){const sess=S.meta.session;
  if(sess){const ms=sess.end-Date.now();if(ms<=0){endSession(false);return}
    const m=Math.floor(ms/60000),sc=Math.floor(ms%60000/1000);document.querySelectorAll('[data-sess-clock]').forEach(e=>e.textContent=`${m}:${pad(sc)}`)}
  document.querySelectorAll('[data-until]').forEach(el=>{const ms=+el.dataset.until-Date.now();if(ms<=0){render();return}const m=Math.floor(ms/60000),sc=Math.floor(ms%60000/1000);el.textContent=`${m}:${pad(sc)} left`})}
setInterval(tickCombo,1000);

function taskRow(t,opts={}){const td=today();const p=projOf(t);const done=t.status==='done';const cat=catOf(t);
  const meta=[];
  if(!opts.hideProject){if(p)meta.push(`<span>${catDot(cat)}${esc(p.name)}</span>`);else if(cat)meta.push(`<span>${catDot(cat)}${cat}</span>`)}
  if(t.due&&!done){const d=dueLabel(t.due);const miss=isMissed(t);meta.push(`<span class="${miss?'late':d.c}">${ICON.clock}${miss?'Missed · ':''}${d.t}${t.at?' · '+fmtTime(t.at):''}</span>`)}
  if(t.kind&&!done)meta.push(`<span>${KINDL[t.kind]||''}${t.at&&t.dur?' · '+fmtDur(t.dur):''}</span>`);
  if(t.resched&&!done)meta.push(`<span>Rescheduled ${t.resched}×</span>`);
  if(t.status==='waiting')meta.push(`<span>${ICON.wait}Waiting on ${esc(t.waitingOn||'someone')}</span>`);
  if(t.recur)meta.push(`<span>${ICON.repeat}${esc(recurLabel(t))}</span>`);
  if(done&&t.loot)meta.push(`<span class="gain">+${t.loot.tokens} min</span>`);
  if(!done)meta.unshift(`<span class="gain">+${BASE_MIN[t.size]||BASE_MIN.M} min</span>`);
  if(!done&&t.carried>=2)meta.push(`<span class="late">moved ${t.carried}×</span>`);
  return `<div class="row ${done?'done':''}"${opts.bare?' style="padding:0;border:0"':''}>
    <button class="check p${t.priority||3}" data-act="done" data-id="${t.id}" aria-label="${done?'Mark not done':'Complete'}: ${esc(t.title)}">${ICON.check}</button>
    <div class="body"><button class="title" data-act="edit" data-id="${t.id}">${esc(t.title)}</button>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div>
    ${done?'':`<div class="acts">${isMissed(t)?`<button class="ib resched" data-act="resched" data-id="${t.id}" aria-label="Reschedule" title="Reschedule">${ICON.repeat}</button>`:''}${opts.today===false?'':`<button class="ib today ${t.todayOn===td?'on':''}" data-act="today" data-id="${t.id}" aria-label="Plan for today" title="Plan for today">${ICON.sun}</button>`}
      <button class="ib ${t.mustWinOn===td?'on':''}" data-act="win" data-id="${t.id}" aria-label="Make a must-win" title="Must-win (max 3 a day, better odds of a bonus)">${ICON.star}</button></div>`}
  </div>`}
const sortTasks=a=>a.sort((x,y)=>(x.priority||3)-(y.priority||3)||((x.due||'9999')<(y.due||'9999')?-1:(x.due||'9999')>(y.due||'9999')?1:0));
const listOf=(ts,o)=>`<div class="list">${ts.map(t=>taskRow(t,o)).join('')}</div>`;

function alertRow(a){const btn=a.task?(a.act==='resched'?`<button class="btn sm primary" data-act="resched" data-id="${a.task}">Reschedule</button>`:a.act==='today'?`<button class="btn sm" data-act="today" data-id="${a.task}">Start today</button>`:`<button class="btn sm" data-act="edit" data-id="${a.task}">Open</button>`)
   :a.project?`<button class="btn sm" data-act="open-project" data-id="${a.project}">Open</button>`:a.view?`<button class="btn sm" data-view="${a.view}">Go</button>`:'';
  return `<div class="alert ${a.sev}"><span class="tag">${esc(a.tag)}</span><div class="msg">${esc(a.msg)}<small>${esc(a.sub)}</small></div>${btn}</div>`}

/* ---------- end-of-day report ---------- */
function dayReport(){const td=today();const dn=dayNumbers();const done=dn.doneToday;const planned=dn.planned;
  const openPlanned=sortTasks(planned.filter(t=>t.status!=='done'));
  const plannedDone=planned.filter(t=>t.status==='done').length;
  const wins=tasks().filter(t=>t.mustWinOn===td);const winsDone=wins.filter(t=>t.status==='done').length;
  const overdue=openTasks().filter(t=>t.due&&t.due<td&&t.status!=='inbox');
  const slipping=openTasks().filter(t=>t.carried>=2);
  const soon=sortTasks(openTasks().filter(t=>t.due&&t.due>td&&diffDays(t.due,td)<=3));
  const ratio=planned.length?plannedDone/planned.length:(done.length?1:0);
  let verdict,sub;
  if(!done.length){verdict='Nothing got finished today.';sub='No judgement, but that is the honest number. One small task before bed keeps your streak alive and makes tomorrow easier to start.'}
  else if(ratio>=1&&openPlanned.length===0){verdict=`You did everything you planned. ${done.length} done.`;sub='That is rare. Close the day and enjoy it.'}
  else if(ratio>=.6){verdict=`Solid day: ${plannedDone} of ${planned.length} planned, ${done.length} done in total.`;sub=`${openPlanned.length} still open. Move them to tomorrow on purpose, or drop the ones that do not matter.`}
  else{verdict=`Honest take: you planned ${planned.length} and finished ${plannedDone}.`;sub='The plan was bigger than the day. Tomorrow, plan fewer things and make the first one small enough to start in 2 minutes.'}
  if(wins.length&&winsDone<wins.length)sub+=` Must-wins: ${winsDone} of ${wins.length}.`;
  const byCat=CATS.map(c=>({c,done:done.filter(t=>catOf(t)===c).length,open:openPlanned.filter(t=>catOf(t)===c).length}));
  const closed=S.meta.reports?.[td]?.closed;
  return{td,done,planned,openPlanned,plannedDone,wins,winsDone,overdue,slipping,soon,verdict,sub,byCat,closed}}

function reportHtml(){const r=dayReport();const max=Math.max(1,...r.byCat.map(x=>x.done+x.open));
  return `<section class="report" id="report">
    <div><div class="eyebrow">Day report · ${fmtDate(r.td)}</div><div class="verdict" style="margin-top:6px">${esc(r.verdict)}</div><div class="verdict-sub">${esc(r.sub)}</div></div>
    <div class="score"><div><b>${r.done.length}</b><small>finished</small></div><div><b>${r.openPlanned.length}</b><small>planned, not done</small></div><div><b style="color:${r.overdue.length?'var(--danger)':'inherit'}">${r.overdue.length}</b><small>overdue overall</small></div><div><b>${r.wins.length?r.winsDone+'/'+r.wins.length:'–'}</b><small>must-wins</small></div></div>
    <div class="catbars">${r.byCat.map(x=>`<div class="catbar"><span>${catDot(x.c)} ${x.c}</span><div class="bar"><i style="width:${(x.done)/max*100}%;background:var(${CATVAR[x.c]})"></i></div><span class="mono" style="color:var(--muted)">${x.done} / ${x.done+x.open}</span></div>`).join('')}</div>
    ${r.openPlanned.length?`<div class="sec-head"><h2 style="font-size:15px">Still open from today</h2><button class="btn sm" data-act="all-tomorrow">Move all to tomorrow</button></div>
      <div class="list">${r.openPlanned.map(t=>`<div class="row" style="flex-wrap:wrap"><div class="body"><button class="title" data-act="edit" data-id="${t.id}">${esc(t.title)}</button><div class="meta">${catOf(t)?`<span>${catDot(catOf(t))}${catOf(t)}</span>`:''}${t.carried?`<span class="${t.carried>=2?'late':''}">moved ${t.carried}× already</span>`:''}</div></div>
        <div class="acts" style="gap:6px"><button class="btn sm" data-act="done" data-id="${t.id}">Done</button><button class="btn sm" data-act="tomorrow" data-id="${t.id}">Tomorrow</button><button class="btn sm ghost" data-act="edit" data-id="${t.id}">Reschedule</button><button class="btn sm ghost" data-act="drop" data-id="${t.id}">Drop</button></div></div>`).join('')}</div>`:''}
    ${r.slipping.length?`<div class="empty-note solid"><b style="color:var(--warn)">Slipping:</b> ${r.slipping.map(t=>esc(t.title)).join(' · ')}. These keep getting pushed. Make each one smaller, or decide to drop it.</div>`:''}
    ${r.soon.length?`<div class="empty-note solid"><b>Coming up in 3 days:</b> ${r.soon.map(t=>`${esc(t.title)} (${dueLabel(t.due).t})`).join(' · ')}</div>`:''}
    <div id="coach-box">${S.coach?`<div class="coach">${esc(S.coach)}</div>`:''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${r.closed?`<span class="allclear" style="padding:8px 12px">${ICON.check} Day closed</span>`:`<button class="btn primary" data-act="close-day">${ICON.moon}Close my day · earn bonus time</button>`}
      <button class="btn" data-act="coach" id="coach-btn">Get a coach's honest take</button>
      ${S.showReport?`<button class="btn ghost" data-act="hide-report">Hide</button>`:''}
    </div></section>`}

function viewToday(){const td=today();
  if(S.mode==='connecting')return `<div class="empty-note">Loading your quests…</div>`;
  if(!tasks().length&&!projects().length)return `<div class="empty-note"><b>Your deck is empty.</b> Type everything on your mind into the box above, one item at a time. Add <code>+work</code>, <code>+personal</code> or <code>+ministry</code> to file it, and a date like <code>fri</code> to schedule it. Unsorted items land in the Inbox.</div>`;
  const rd=radar();const wins=tasks().filter(t=>t.mustWinOn===td&&inArea(t));
  const winSlots=wins.slice(0,3).map((t,i)=>`<div class="win ${t.status==='done'?'won':''}"><span class="slot">MUST-WIN ${i+1}</span>${taskRow(t,{today:false,bare:true})}</div>`).join('');
  const todayList=sortTasks(openTasks().filter(inArea).filter(t=>t.mustWinOn!==td&&(t.todayOn===td||(t.due&&t.due<=td&&t.status!=='inbox')))).sort((a,b)=>(a.due===td&&a.at?a.at:'99:99')<(b.due===td&&b.at?b.at:'99:99')?-1:(a.due===td&&a.at?a.at:'99:99')>(b.due===td&&b.at?b.at:'99:99')?1:0);
  const suggest=sortTasks(openTasks().filter(inArea).filter(t=>t.status==='next'&&t.todayOn!==td&&t.mustWinOn!==td&&!(t.due&&t.due<=td))).slice(0,3);
  const doneToday=tasks().filter(inArea).filter(t=>t.status==='done'&&isoDay(t.doneAt)===td);
  const evening=new Date().getHours()>=18;const closed=S.meta.reports?.[td]?.closed;
  const showRep=S.showReport||(evening&&!closed);
  return `${showRep?reportHtml():''}
   ${rd.length?`<section><div class="sec-head"><h2>Heads-up</h2>${rd.length>2?`<span class="sub">+${rd.length-2} more</span>`:''}</div>
     <div class="radar">${rd.slice(0,2).map(alertRow).join('')}</div></section>`:''}
   ${winSlots?`<section><div class="sec-head"><h2>Must-wins</h2></div><div class="wins">${winSlots}</div></section>`:''}
   ${todayList.length?`<section><div class="sec-head"><h2>Today</h2></div>${listOf(todayList)}</section>`:''}
   ${suggest.length?`<section><div class="sec-head"><h2>Up next</h2><button class="btn sm" data-act="lucky">Pick one for me</button></div>${listOf(suggest)}</section>`:''}
   ${doneToday.length?`<section><div class="sec-head"><h2>Done today</h2><span class="sub">${fmtMin(doneToday.reduce((s,t)=>s+(t.loot?.tokens||0),0))} earned</span></div>${listOf(doneToday)}</section>`:''}
   ${(!rd.length&&!winSlots&&!todayList.length&&!suggest.length&&!doneToday.length)?`<div class="empty-note"><b>Nothing on your plate.</b> Add a task above. Each one shows the screen time it will earn.</div>`:''}
   ${showRep?'':`<div><button class="btn ghost" data-act="show-report">${ICON.moon}End my day</button></div>`}`}

function viewInbox(){const items=openTasks().filter(t=>t.status==='inbox').sort((a,b)=>(a.createdAt||'')<(b.createdAt||'')?-1:1);
  return `<section><div class="sec-head"><h2>Inbox</h2><span class="sub">${items.length} to sort · capture fast, decide later</span></div>
   <div class="empty-note solid">For each item: <b>under 2 minutes?</b> Do it now. <b>Needs doing?</b> Pick its category or project, or give it a date. <b>Not really?</b> Delete it.</div>
   ${items.length?`<div class="list">${items.map(t=>`<div class="row" style="flex-wrap:wrap">
      <div class="body"><button class="title" data-act="edit" data-id="${t.id}">${esc(t.title)}</button></div>
      <div class="acts" style="gap:6px;flex-wrap:wrap">
        <button class="btn sm" data-act="done" data-id="${t.id}">Did it</button>
        ${CATS.map(c=>`<button class="btn sm" data-act="set-cat" data-id="${t.id}" data-cat="${c}">${catDot(c)}${c}</button>`).join('')}
        <button class="btn sm" data-act="edit" data-id="${t.id}">More…</button>
        <button class="btn sm ghost" data-act="del" data-id="${t.id}">Delete</button></div></div>`).join('')}</div>`
   :`<div class="allclear">${ICON.check} Inbox zero. Your head is clear.</div>`}</section>`}

function bossCard(p){const i=projectInfo(p);const total=i.ts.length;const pct=total?i.open.length/total*100:100;const c=catOfProject(p);
  return `<button class="boss" style="--pc:var(--${p.color||'c1'})" data-act="open-project" data-id="${p.id}">
    <span class="area" style="color:${c?`var(${CATVAR[c]})`:'var(--muted)'}">${c||'No category'}</span><h3>${esc(p.name)}</h3>
    <div class="hp"><div class="bar"><i style="width:${pct}%"></i></div><div class="lbl"><span class="mono">${i.open.length}/${total} HP</span><span>${i.next.length} next · ${i.open.length-i.next.length} other</span></div></div>
    <div class="row2"><span class="health ${i.health[1]}">${i.health[0]}</span><span>${p.deadline?(i.left<0?`${-i.left}d past`:`${i.left}d left`):'No deadline'}</span></div></button>`}
function viewProjects(){if(S.openProject&&S.projects[S.openProject])return viewProject(S.projects[S.openProject]);
  const ps=projects().filter(pInArea);
  const groups=S.area==='All'?[...CATS,null]:[S.area];
  const loose=S.area==='All'?[]:sortTasks(openTasks().filter(t=>!t.projectId&&t.cat===S.area&&t.status!=='inbox'));
  return `<section><div class="sec-head"><h2>Projects</h2><button class="btn sm primary" data-act="new-project">New project</button></div>
   <p style="margin:0;color:var(--muted);font-size:13px">Each project is a boss. Its health bar is the work left. Clear every task to defeat it.</p>
   ${ps.length?groups.map(g=>{const list=ps.filter(p=>catOfProject(p)===g);if(!list.length)return '';
     return `${S.area==='All'?`<div class="groupname">${g?`<i style="background:var(${CATVAR[g]})"></i>${g}`:'No category'}</div>`:''}<div class="bosses">${list.map(bossCard).join('')}</div>`}).join('')
   :`<div class="empty-note">No ${S.area==='All'?'':S.area+' '}projects yet. Create one, or type <code>#name</code> in the capture box to make one on the fly.</div>`}
   ${loose.length?`<div class="eyebrow" style="margin-top:6px">${S.area} tasks without a project</div>${listOf(loose)}`:''}</section>`}

function viewProject(p){const i=projectInfo(p);const groups=[['next','Next actions'],['waiting','Waiting for'],['inbox','Unsorted'],['someday','Someday']];const c=catOfProject(p);
  const done=i.ts.filter(t=>t.status==='done').sort((a,b)=>(b.doneAt||'')>(a.doneAt||'')?1:-1);
  return `<section><button class="back" data-act="close-project">${ICON.left}All projects</button>
   <div class="boss" style="--pc:var(--${p.color||'c1'});cursor:default">
     <span class="area" style="color:${c?`var(${CATVAR[c]})`:'var(--muted)'}">${c||'No category'}</span><h3 style="font-size:22px">${esc(p.name)}</h3>
     ${p.goal?`<div style="color:var(--muted);font-size:14px">${esc(p.goal)}</div>`:''}
     <div class="hp"><div class="bar"><i style="width:${i.ts.length?i.open.length/i.ts.length*100:100}%"></i></div><div class="lbl"><span class="mono">${i.open.length}/${i.ts.length} HP</span><span>${p.deadline?`Deadline ${fmtDate(p.deadline)}`:'No deadline'}</span></div></div>
     <div class="row2"><span class="health ${i.health[1]}">${i.health[0]}</span><button class="btn sm" data-act="edit-project" data-id="${p.id}">Edit project</button></div>
   </div>
   <form class="inline-add" data-form="proj-add" data-id="${p.id}"><input id="pa-${p.id}" placeholder="Add the next step for ${esc(p.name)}…" aria-label="Add task to project"><button class="btn primary" type="submit">Add</button></form>
   ${groups.map(([k,l])=>{const ts=sortTasks(i.open.filter(t=>t.status===k));return ts.length?`<div class="eyebrow" style="margin-top:6px">${l}</div>${listOf(ts,{hideProject:true})}`:''}).join('')}
   ${!i.open.length?`<div class="allclear">${i.ts.length?'Boss defeated. Archive it from Edit project, or add the next phase.':'No tasks yet. Add the very next step above.'}</div>`:''}
   ${done.length?`<div class="eyebrow" style="margin-top:6px">Done (${done.length})</div>${listOf(done.slice(0,10),{hideProject:true})}`:''}
  </section>`}

function viewUpcoming(){const td=today();const days=[];const open=openTasks().filter(inArea).filter(t=>t.status!=='inbox');
  const overdue=sortTasks(open.filter(t=>t.due&&t.due<td));
  for(let n=0;n<14;n++){const d=addDays(td,n);
    const due=sortTasks(open.filter(t=>t.due===d));
    const starts=open.filter(t=>t.due&&t.due>d&&!t.recur&&addDays(t.due,-warnOf(t))===d&&n>0);
    const dl=projects().filter(p=>p.deadline===d&&pInArea(p));
    if(n<2||due.length||starts.length||dl.length)days.push({d,n,due,starts,dl})}
  const undated=open.filter(t=>!t.due&&t.status==='next').length;
  const recurring=sortTasks(openTasks().filter(inArea).filter(t=>t.recur));
  return `<section><div class="sec-head"><h2>Next 14 days</h2><span class="sub">Orange lines mark the day you should start</span></div>
   ${overdue.length?`<div class="day"><h3><b style="color:var(--danger)">Overdue</b>${overdue.length}</h3>${listOf(overdue)}</div>`:''}
   ${days.map(x=>`<div class="day"><h3><b>${x.n===0?'Today':x.n===1?'Tomorrow':parseYmd(x.d).toLocaleDateString(undefined,{weekday:'long'})}</b>${parseYmd(x.d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</h3>
     ${x.dl.map(p=>`<div class="marker deadline">Project deadline: ${esc(p.name)}</div>`).join('')}
     ${x.starts.map(t=>`<div class="marker">Start "${esc(t.title)}" today. It is due ${fmtDate(t.due)}.</div>`).join('')}
     ${x.due.length?listOf(x.due):(!x.dl.length&&!x.starts.length?`<div style="font-size:13px;color:var(--muted)">Nothing due</div>`:'')}</div>`).join('')}
   <div style="color:var(--muted);font-size:13px">${undated} next actions have no date. That is fine. Not everything needs one.</div></section>
   <section><div class="sec-head"><h2>Recurring tasks</h2><button class="btn sm primary" data-act="new-recurring">New recurring task</button></div>
     ${recurring.length?`<div class="list">${recurring.map(t=>`<div class="row"><span style="color:var(--muted);margin-top:2px">${ICON.repeat}</span><div class="body"><button class="title" data-act="edit" data-id="${t.id}">${esc(t.title)}</button>
       <div class="meta"><span>${esc(recurLabel(t))}</span>${catOf(t)?`<span>${catDot(catOf(t))}${catOf(t)}</span>`:''}${t.due?`<span>next ${dueLabel(t.due).t}</span>`:''}</div></div></div>`).join('')}</div>`
     :`<div class="empty-note">No recurring tasks yet. Type something like <code>Pay rent monthly +personal</code>, <code>Gym every mon wed fri</code> or <code>Team standup weekdays +work</code>.</div>`}</section>`}

function viewReview(){const ws=weekStart();const checks=S.meta.checks?.week===ws?S.meta.checks.done||[]:[];
  const outs=S.meta.outcomes?.week===ws?S.meta.outcomes.items:['','',''];
  const inbox=openTasks().filter(t=>t.status==='inbox').length;
  const stuck=projects().filter(p=>projectInfo(p).health[0]==='No next step').length;
  const waiting=openTasks().filter(t=>t.status==='waiting').length;
  const doneThisWeek=(S.meta.reviews||[]).some(d=>d>=ws);
  const steps=[['Brain dump','Capture every open loop: emails, promises, ideas, worries.'],
    ['Process the inbox',inbox?`${inbox} items still unsorted.`:'Inbox is at zero.'],
    ['Give every project a next step',stuck?`${stuck} project${stuck>1?'s have':' has'} no next action.`:'Every project has a next step.'],
    ['Check what you are waiting on',waiting?`${waiting} item${waiting>1?'s':''} waiting on other people. Nudge the slow ones.`:'Nothing waiting on others.'],
    ['Look two weeks ahead','Open Upcoming and your calendar. Start anything big now.'],
    ['Check the balance','Did Work, Personal and Ministry each get attention? Plan one thing for whichever got none.'],
    ['Pick next week\'s 3 outcomes','Write them below. They guide your daily must-wins.']];
  // last 7 days, planned vs done
  const st=stats();const td=today();const reps=S.meta.reports||{};
  const days=[...Array(7)].map((_,i)=>{const d=addDays(td,i-6);const done=(st.byDay[d]||[]).length;const planned=d===td?dayNumbers().planned.length:(reps[d]?.planned??null);return{d,done,planned}});
  const max=Math.max(3,...days.map(x=>Math.max(x.done,x.planned||0)));
  const wk=tasks().filter(t=>t.status==='done'&&isoDay(t.doneAt)>=ws);
  const closedDays=Object.values(reps).filter(r=>r.closed).length;
  return `<section><div class="sec-head"><h2>Last 7 days</h2><span class="sub">The honest trend</span></div>
    <div class="report" style="border-top-color:var(--accent)">
      <div class="week">${days.map(x=>`<div class="wk"><div class="cols"><i class="p" style="height:${(x.planned||0)/max*96}px" title="planned ${x.planned??'?'}"></i><i class="d" style="height:${x.done/max*96}px" title="done ${x.done}"></i></div><span>${parseYmd(x.d).toLocaleDateString(undefined,{weekday:'short'})}</span><span class="mono" style="color:var(--ink)">${x.done}${x.planned!=null?'/'+x.planned:''}</span></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--line)"></i>planned</span><span><i style="background:var(--ok)"></i>done</span><span>Planned counts appear for days you closed.</span></div>
      <div class="catbars">${CATS.map(c=>{const n=wk.filter(t=>catOf(t)===c).length;return `<div class="catbar"><span>${catDot(c)} ${c}</span><div class="bar"><i style="width:${wk.length?n/wk.length*100:0}%;background:var(${CATVAR[c]})"></i></div><span class="mono" style="color:var(--muted)">${n} done</span></div>`}).join('')}</div>
    </div></section>
   <section><div class="sec-head"><h2>Weekly review</h2><span class="sub">${doneThisWeek?'Done for this week':'Week of '+fmtDate(ws)} · earns 15 bonus minutes</span></div>
    <div class="steps">${steps.map(([a,b],i)=>`<div class="step"><input type="checkbox" id="rv-${i}" data-act="check" data-id="${i}" ${checks[i]?'checked':''}><label for="rv-${i}"><b>${a}</b><small>${esc(b)}</small></label></div>`).join('')}</div>

  saveMeta({session:null,spent});
  if(early)toast(back>0?`Session ended. <b>${back} min</b> back in your bank.`:'Session ended.');
  else{tone([660,520],.2,.12);buzz([30,60,30]);toast(`<b>Time's up.</b> ${esc(sess.name)} is locked again. Go earn more.`)}}

/* ---------- coach (asks Claude, on the viewer's own account) ---------- */
let coachCtl=null;
async function runCoach(){const box=document.getElementById('coach-box');const btn=document.getElementById('coach-btn');
  let sample=null;try{sample=window.claude?.use?await window.claude.use('sample'):null}catch{}
  if(!sample){toast('The coach needs Quest Deck opened from claude.ai.');return}
  const r=dayReport();const st=stats();
  const lines=t=>`- ${t.title} [${catOf(t)||'no category'}${t.carried?`, pushed ${t.carried}x`:''}${t.due?`, due ${t.due}`:''}]`;
  const prompt=`You are a frank, warm accountability coach and behavioral psychologist. Talk to the user like a supportive friend who does not sugarcoat ("hey man" tone is fine). Write 4-6 short sentences, plain text, no lists, no headings. Name specific tasks. Say what went well, what honestly did not, the one pattern you notice, and the single smallest first step for tomorrow morning. Never shame. Today is ${r.td}.

Finished today (${r.done.length}):
${r.done.map(lines).join('\n')||'- none'}

Planned but not done (${r.openPlanned.length}):
${r.openPlanned.map(lines).join('\n')||'- none'}

Overdue overall: ${r.overdue.length}. Repeatedly pushed: ${r.slipping.map(t=>t.title).join('; ')||'none'}.
Must-wins: ${r.winsDone}/${r.wins.length}. Streak: ${st.streak} days. By category today: ${r.byCat.map(x=>`${x.c} ${x.done} done, ${x.open} open`).join('; ')}.`;
  coachCtl?.abort();coachCtl=new AbortController();btn.disabled=true;box.innerHTML='<div class="coach">Thinking…</div>';
  try{const {text}=await sample(prompt,{signal:coachCtl.signal,onText:({text})=>{box.innerHTML=`<div class="coach">${esc(text)}</div>`}});S.coach=text}
  catch(e){box.innerHTML=e.text?`<div class="coach">${esc(e.text)}</div>`:'';
    if(e.code==='not_granted'||e.code==='sampling_disabled')toast('The coach is off because Claude access was not allowed for this page.');
    else if(e.code==='rate_limited')toast('The coach is busy. Try again in a few minutes.');
    else if(e.code!=='cancelled')toast('The coach could not answer just now. Try again.')}
  finally{const b=document.getElementById('coach-btn');if(b)b.disabled=false}}

/* ---------- events ---------- */
function setView(v){S.view=v;if(v!=='projects')S.openProject=null;try{history.replaceState(null,'','#'+v)}catch{}render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{
  const vb=e.target.closest('[data-view]');if(vb&&!e.target.closest('.sheet')){setView(vb.dataset.view);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='close-sheet'){if(e.target===el)closeSheet();return}
  if(a==='close-chest'){document.getElementById('chest-root').innerHTML='';return}
  if(a==='done'){completeTask(id,e);return}
  if(a==='today'){toggleToday(id);return}
  if(a==='win'){toggleMustWin(id);return}
  if(a==='edit'){openTaskSheet(id);return}
  if(a==='del'){const t=S.tasks[id];deleteTask(id);toast(`Deleted "${esc(t.title)}"`,()=>saveTask(t));return}
  if(a==='set-cat'){const t=S.tasks[id];saveTask({...t,cat:el.dataset.cat,status:'next'});toast(`Filed to ${el.dataset.cat}`);return}
  if(a==='area'){S.area=id;S.openProject=null;try{localStorage.setItem('qd-area',id)}catch{}render();return}
  if(a==='sound'){soundOn=!soundOn;try{localStorage.setItem('qd-sound',soundOn?'on':'off')}catch{}if(soundOn)tone([660,880]);render();if(document.querySelector('[data-form="reward"]'))openRewardsSheet();return}
  if(a==='rewards'){openRewardsSheet();return}
  if(a==='resched'){openRescheduleSheet(id);return}
  if(a==='rs-quick'){reschedule(id,el.dataset.d,el.dataset.h);return}
  if(a==='open-project'){S.view='projects';S.openProject=id;try{history.replaceState(null,'','#projects')}catch{}render();window.scrollTo({top:0});return}
  if(a==='close-project'){S.openProject=null;render();return}
  if(a==='new-project'){openProjectSheet(null);return}
  if(a==='new-recurring'){openTaskSheet(null,{recur:'weekly'});return}
  if(a==='edit-project'){openProjectSheet(id);return}
  if(a==='swatch'){const w=document.getElementById('p-color');w.dataset.v=id;w.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));return}
  if(a==='seg'){const w=el.closest('.seg');if(w.id==='e-kind'&&w.dataset.v===id){w.dataset.v='';w.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));return}w.dataset.v=id;w.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));return}
  if(a==='dow'){el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')!=='true');return}
  if(a==='lucky'){const pool=openTasks().filter(inArea).filter(t=>t.status==='next'&&t.mustWinOn!==today());if(!pool.length)return;
    const t=pool[Math.random()*pool.length|0];toggleToday(t.id);tone([440,554,659]);toast(`Your next quest: <b>${esc(t.title)}</b>. Just do the first 2 minutes.`);return}
  if(a==='archive-project'){const p=S.projects[id];saveProject({...p,archived:true});closeSheet();S.openProject=null;toast(`Archived ${esc(p.name)}`,()=>saveProject({...p,archived:false}));return}
  if(a==='del-armed'){if(delArmed!==id){delArmed=id;el.textContent='Tap again to delete';return}
    const form=el.closest('form');if(form.dataset.form==='task'){const t=S.tasks[id];deleteTask(id);toast(`Deleted "${esc(t.title)}"`,()=>saveTask(t))}
    else{const p=S.projects[id];const ts=tasks().filter(t=>t.projectId===id);ts.forEach(t=>deleteTask(t.id));deleteProject(id);S.openProject=null;toast(`Deleted ${esc(p.name)} and ${ts.length} tasks`)}
    closeSheet();return}
  if(a==='check'){const ws=weekStart();const cur=S.meta.checks?.week===ws?[...(S.meta.checks.done||[])]:[];cur[+id]=el.checked;saveMeta({checks:{week:ws,done:cur}});return}
  if(a==='finish-review'){const ws=weekStart();if((S.meta.reviews||[]).some(d=>d>=ws))return;const b={at:new Date().toISOString(),tokens:15,ticket:false,why:'Weekly review'};
    saveMeta({reviews:[...(S.meta.reviews||[]),today()],bonuses:[...(S.meta.bonuses||[]),b]});showChest('epic',b.tokens,b.ticket,'Weekly review done. You are ahead of next week.');burst(null,true);tone([523,659,784,1047],.14,.09);return}
  if(a==='show-report'){S.showReport=true;render();setTimeout(()=>document.getElementById('report')?.scrollIntoView({behavior:'smooth'}),50);return}
  if(a==='hide-report'){S.showReport=false;render();return}
  if(a==='tomorrow'){pushTomorrow(id);return}
  if(a==='all-tomorrow'){dayReport().openPlanned.forEach(t=>pushTomorrow(t.id));toast('Moved to tomorrow. Plan fewer, finish more.');return}
  if(a==='drop'){const t=S.tasks[id];saveTask({...t,status:'someday',todayOn:null,mustWinOn:null});toast(`Moved "${esc(t.title)}" to Someday`,()=>saveTask(t));return}
  if(a==='coach'){runCoach();return}
  if(a==='close-day'){const r=dayReport();const td=today();if(S.meta.reports?.[td]?.closed)return;
    const roll1=roll(r.plannedDone>=r.planned.length&&r.planned.length>0);const b={at:new Date().toISOString(),tokens:Math.max(5,roll1.tokens),ticket:false,why:'Day closed'};
    saveMeta({reports:{...(S.meta.reports||{}),[td]:{planned:r.planned.length,done:r.done.length,closed:true}},bonuses:[...(S.meta.bonuses||[]),b]});
    showChest(roll1.tier,b.tokens,false,'Shutdown complete. Rest well.');chestSound(roll1.tier,1);S.showReport=true;return}
  if(a==='redeem'){startSession(id);return}
  if(a==='end-session'){endSession(true);return}
  if(a==='del-reward'){saveMeta({rewards:rewardsList().filter(x=>x.id!==id)});openRewardsSheet();return}
});
