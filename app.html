<title>Quest Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a personal command deck. HUD strip (daily ring, streak, combo, tokens) over a category switch, capture bar and one view at a time; side rail on desktop, bottom tab bar on phones. */
:root{
  --bg:#edf0f6; --surface:#ffffff; --sunk:#e3e7f1; --ink:#161d33; --muted:#5a6480; --line:#d5dbe8;
  --accent:#3445c4; --accent-ink:#ffffff; --gold:#b97a00; --coin:#e3a10a;
  --danger:#c2362c; --warn:#a96400; --ok:#1d7f55;
  --c1:#3445c4; --c2:#c2362c; --c3:#1d7f55; --c4:#a96400; --c5:#8a3fb8; --c6:#0f7f96;
  --work:#0f7f96; --personal:#1d7f55; --ministry:#8a3fb8;
  --shadow:0 1px 2px rgba(22,29,51,.06),0 6px 18px rgba(22,29,51,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#171e33; --sunk:#111829; --ink:#e6e9f4; --muted:#95a0bd; --line:#283253;
  --accent:#8e9bff; --accent-ink:#0e1322; --gold:#ffc84a; --coin:#ffc84a;
  --danger:#ff7b70; --warn:#ffb648; --ok:#52d49c;
  --c1:#8e9bff; --c2:#ff7b70; --c3:#52d49c; --c4:#ffb648; --c5:#d39bff; --c6:#5fd3ea;
  --work:#5fd3ea; --personal:#52d49c; --ministry:#d39bff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#171e33; --sunk:#111829; --ink:#e6e9f4; --muted:#95a0bd; --line:#283253;
  --accent:#8e9bff; --accent-ink:#0e1322; --gold:#ffc84a; --coin:#ffc84a;
  --danger:#ff7b70; --warn:#ffb648; --ok:#52d49c;
  --c1:#8e9bff; --c2:#ff7b70; --c3:#52d49c; --c4:#ffb648; --c5:#d39bff; --c6:#5fd3ea;
  --work:#5fd3ea; --personal:#52d49c; --ministry:#d39bff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.app{max-width:1120px;margin:0 auto;display:grid;gap:20px}
@media (min-width:900px){.app{grid-template-columns:200px minmax(0,1fr);align-items:start}body{padding-bottom:32px}}

/* nav */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:none;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
nav.tabs .count{margin-left:auto;font:700 11px var(--f-mono);background:var(--sunk);color:var(--muted);padding:1px 7px;border-radius:99px}
nav.tabs .count.hot{background:var(--danger);color:var(--surface)}
.rail{display:grid;gap:18px}
.rail .sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-left:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
@media (min-width:900px){.rail{position:sticky;top:max(16px,env(safe-area-inset-top,0px))}nav.tabs{flex-direction:column}}
@media (max-width:899px){
  .rail .brand-row{display:flex;justify-content:space-between;align-items:center}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  nav.tabs button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;position:relative}
  nav.tabs button[aria-current="page"]{box-shadow:none;background:var(--sunk)}
  nav.tabs .count{position:absolute;top:2px;right:calc(50% - 22px);margin:0;font-size:10px;padding:0 5px}
  .rail .sync{padding-left:0}
}

/* HUD */
.hud{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;display:grid;gap:12px;grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
@media (max-width:560px){.hud{grid-template-columns:auto minmax(0,1fr) auto}}
.ring{position:relative;width:56px;height:56px}
.ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .trk{stroke:var(--sunk)}
.ring .val{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring.closed .val{stroke:var(--coin)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .num b{font:700 14px var(--f-mono)}
.ring .num small{display:none!important;font-size:10px;color:var(--muted);font-weight:600;display:block}
.hud-main{display:grid;gap:6px;min-width:0}
.hud-title{display:none}
.hud-line{font-size:14px;color:var(--muted);line-height:1.3}
.hud-line b{color:var(--ink)}
.hud-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.hud-stats b{color:var(--ink);font-family:var(--f-mono);font-weight:700}
.stat{display:inline-flex;align-items:center;gap:6px}
.stat .ico{width:16px;height:16px}
.flame{color:var(--muted)}.flame.lit{color:var(--danger)}.flame.lit .ico{fill:currentColor}
.flame.risk{color:var(--warn)}
.combo{color:var(--accent);font-weight:700}
.wallet{display:flex;align-items:center;gap:8px;border:0;background:var(--sunk);border-radius:99px;padding:4px 12px 4px 5px;justify-self:end}
.coin{width:22px;height:22px;border-radius:50%;background:var(--coin);display:grid;place-items:center;color:#3a2600;font:800 13px var(--f-mono);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.wallet b{font:700 15px var(--f-mono);display:block;line-height:1.1}
.wallet small{display:none!important;font-size:11px;color:var(--muted);display:block;text-align:left}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* category switch */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;flex:none}
.cat i{width:9px;height:9px;border-radius:3px;display:inline-block}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat .n{font:700 11px var(--f-mono);opacity:.75}

/* capture */
.capture{display:grid;gap:6px}
.capture form{display:flex;gap:8px}
.capture input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.capture input:focus{border-color:var(--accent);outline:none}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:none;color:var(--danger);border:1.5px solid currentColor}
.btn.ghost{background:none;color:var(--muted);padding:6px 10px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.hint{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.hint code,.empty-note code{font:600 11.5px var(--f-mono);background:var(--sunk);padding:1px 6px;border-radius:5px;color:var(--ink)}
.preview{font-size:12.5px;color:var(--accent);min-height:0}
.capture .hint{display:none}.capture:focus-within .hint{display:flex}

main{display:grid;gap:14px;min-width:0}
section{display:grid;gap:10px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:17px;font-weight:800}
.sec-head .sub{font-size:13px;color:var(--muted)}
.eyebrow{font:700 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* radar */
.radar{display:grid;gap:6px}
.alert{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:10px;padding:10px 12px;border-left:4px solid var(--muted)}
.alert.critical{border-color:var(--danger)}.alert.warning{border-color:var(--warn)}.alert.info{border-color:var(--accent)}
.alert .tag{font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;flex:none;width:82px}
.alert.critical .tag{color:var(--danger)}.alert.warning .tag{color:var(--warn)}.alert.info .tag{color:var(--accent)}
.alert .msg{flex:1;min-width:0;font-size:14px}
.alert .msg small{display:block;color:var(--muted);font-size:12.5px}
.alert .tag{display:none}.alert .msg small{display:none}.alert .msg{font-weight:600}
.allclear{background:var(--surface);border-radius:10px;padding:12px 14px;color:var(--ok);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}

/* must-wins */
.wins{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:700px){.wins{grid-template-columns:1fr}}
.win{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:grid;gap:8px;align-content:start;min-height:88px}
.win .slot{font:700 11px var(--f-mono);color:var(--gold);letter-spacing:.1em}
.win.empty{background:none;box-shadow:none;border:1.5px dashed var(--line);color:var(--muted);font-size:13px}
.win.won{outline:2px solid var(--coin)}

/* tasks */
.list{display:grid;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:none;flex:none;margin-top:1px;display:grid;place-items:center;padding:0;color:transparent;transition:background .15s,transform .15s}
.check:active{transform:scale(.85)}
.check.p1{border-color:var(--danger)}.check.p2{border-color:var(--warn)}
.check:hover{color:var(--muted)}
.check .ico{width:13px;height:13px;stroke-width:3}
.row.done .check{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.body{flex:1;min-width:0;display:grid;gap:3px}
.title{background:none;border:0;padding:0;text-align:left;font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ico{width:13px;height:13px}
.meta .late{color:var(--danger);font-weight:700}.meta .soon{color:var(--warn);font-weight:700}
.pdot{width:8px;height:8px;border-radius:3px;flex:none;display:inline-block}
.acts{display:flex;gap:2px;flex:none}
.ib{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib.on{color:var(--gold)}.ib.on .ico{fill:currentColor}
.ib.today.on{color:var(--warn)}
.tier{font:700 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.t-common{color:var(--muted)}.t-rare{color:var(--accent)}.t-epic{color:var(--c5)}.t-legendary{color:var(--gold)}
.empty-note{background:var(--surface);border-radius:var(--r);padding:14px 16px;color:var(--muted);font-size:14px;border:1.5px dashed var(--line)}
.empty-note.solid{border-style:solid}

/* projects */
.bosses{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.boss{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;text-align:left;border:0;border-top:4px solid var(--pc,var(--accent))}
.boss h3{font-size:16px;font-weight:800}
.boss .area{font:700 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.hp{display:grid;gap:4px}
.hp .bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hp .bar i{display:block;height:100%;background:var(--pc,var(--accent))}
.hp .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.health{font:700 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;justify-self:start}
.health.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.health.warning{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.health.critical{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.health.info{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.boss .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:0;display:inline-flex;gap:4px;align-items:center;justify-self:start}
.groupname{display:flex;align-items:center;gap:8px;font:800 14px var(--f-display);margin-top:4px}
.groupname i{width:10px;height:10px;border-radius:3px}

/* upcoming */
.day{display:grid;gap:6px}
.day h3{font:700 13px var(--f-body);color:var(--muted);display:flex;gap:8px;align-items:baseline}
.day h3 b{color:var(--ink);font-family:var(--f-display);font-size:15px}
.marker{font-size:12.5px;color:var(--warn);padding:6px 12px;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-radius:8px}
.marker.deadline{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface));font-weight:600}

/* report */
.report{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;border-top:4px solid var(--ink)}
.report .verdict{font:800 20px/1.25 var(--f-display)}
.report .verdict-sub{color:var(--muted);font-size:14px;margin-top:4px}
.score{display:flex;gap:18px;flex-wrap:wrap}
.score div{display:grid}
.score b{font:700 26px var(--f-mono);line-height:1.1}
.score small{color:var(--muted);font-size:12px}
.catbars{display:grid;gap:8px}
.catbar{display:grid;grid-template-columns:76px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.catbar .bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.catbar .bar i{display:block;height:100%;border-radius:99px}
.coach{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14px;white-space:pre-wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px}
.wk{display:grid;gap:4px;justify-items:center;align-content:end;height:100%;font-size:11px;color:var(--muted)}
.wk .cols{display:flex;gap:3px;align-items:flex-end;height:96px}
.wk .cols i{width:12px;border-radius:4px 4px 0 0;display:block;min-height:2px}
.wk .p{background:var(--line)}.wk .d{background:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* review */
.steps{display:grid;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.step label{flex:1;min-width:0}
.step label small{display:block;color:var(--muted);font-size:12.5px}
.outcomes{display:grid;gap:8px}
.outcomes input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}

/* rewards */
.rewards{display:grid;gap:8px}
.reward{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px}
.reward .name{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.reward .cost{font:700 13px var(--f-mono);color:var(--gold);flex:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:40;display:grid;place-items:end center}
@media (min-width:700px){.scrim{place-items:center}}
.sheet{background:var(--surface);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:12px}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet h2{font-size:18px}
.field{display:grid;gap:4px}
.field label,.field .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%}
.grid2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:4px}
.swatches,.seg,.dows{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:8px;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.seg button,.dows button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:700;display:inline-flex;gap:7px;align-items:center}
.dows button{padding:6px 0;width:42px;justify-content:center;font-size:13px}
.seg button[aria-pressed="true"],.dows button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg i{width:9px;height:9px;border-radius:3px}

/* chest reveal */
.chest{position:fixed;inset:0;z-index:65;display:grid;place-items:center;pointer-events:none}
.chest .card{pointer-events:auto;background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:22px 26px;text-align:center;display:grid;gap:6px;min-width:240px;border:3px solid var(--tc);animation:chest .5s cubic-bezier(.2,1.4,.4,1)}
.chest .card .tier{font-size:12px;color:var(--tc)}
.chest .card b{font:800 34px var(--f-display);color:var(--tc)}
.chest .card small{color:var(--muted);font-size:13px}
@keyframes chest{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}

/* toast + fx */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:min(420px,calc(100% - 32px))}
@media (min-width:900px){.toasts{bottom:24px}}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:var(--shadow);animation:pop .25s ease-out}
.toast b{color:var(--coin)}
.toast button{margin-left:auto;background:none;border:0;color:var(--coin);font-weight:700}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const ICON={
  check:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  star:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  sun:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  flame:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 2.5c1 4 5.5 6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.2 1-3.8 2.2-4.8 0 2 1 3.2 2.2 3.4-1-3.2 0-6.4 1.1-9.6z"/></svg>',
  bolt:'<svg class="ico" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  repeat:'<svg class="ico" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  clock:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  wait:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M7 2c0 5 10 5 10 10S7 17 7 22M17 2c0 5-10 5-10 10s10 5 10 10"/></svg>',
  today:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  inbox:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>',
  boss:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>',
  cal:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>',
  review:'<svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  moon:'<svg class="ico" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  gift:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8S10 3 7.5 4 9 8 12 8zm0 0s2-5 4.5-4S15 8 12 8z"/></svg>',
  ticket:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 0 4v5h18v-5a2 2 0 0 1 0-4V4H3z"/><path d="M14 4v13"/></svg>',
  sound:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>',
  mute:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>',
  left:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>'
};
const VIEWS=[['today','Today',ICON.today],['inbox','Inbox',ICON.inbox],['projects','Projects',ICON.boss],['upcoming','Upcoming',ICON.cal],['review','Review',ICON.review]];
const CATS=['Work','Personal','Ministry'];
const CATVAR={Work:'--work',Personal:'--personal',Ministry:'--ministry'};
const COLORS=['c1','c2','c3','c4','c5','c6'];
const SIZE={S:'Small',M:'Medium',L:'Large'};
const TIERS={common:'Common',rare:'Rare',epic:'Epic',legendary:'Legendary'};
const TIERVAR={common:'--muted',rare:'--accent',epic:'--c5',legendary:'--gold'};
const TIERRANK={common:0,rare:1,epic:2,legendary:3};
const COMBO_MIN=30;
const RECURS=[['','Never'],['daily','Every day'],['weekdays','Weekdays (Mon–Fri)'],['weekly','Every week'],['biweekly','Every 2 weeks'],['monthly','Every month'],['custom','On specific days']];
const DOWS=['sun','mon','tue','wed','thu','fri','sat'];
const DOWL=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const DEFAULT_REWARDS=[{id:'r1',name:'Favourite coffee or snack',cost:10},{id:'r2',name:'One episode of a show, guilt-free',cost:20},{id:'r3',name:'An hour of gaming or scrolling',cost:35},{id:'r4',name:'Buy something from my wishlist',cost:150}];

const S={projects:{},tasks:{},meta:{},mode:'connecting',db:null,view:'today',area:'All',openProject:null,showReport:false,coach:null};
try{const a=localStorage.getItem('qd-area');if(a&&(a==='All'||CATS.includes(a)))S.area=a}catch{}
let soundOn=true;try{soundOn=localStorage.getItem('qd-sound')!=='off'}catch{}
const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h;

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const weekStart=(s=today())=>{const k=(parseYmd(s).getDay()+6)%7;return addDays(s,-k)};
const fmtDate=s=>parseYmd(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
function dueLabel(due){const n=diffDays(due,today());
  if(n<0)return{t:(-n)+'d late',c:'late'};if(n===0)return{t:'Today',c:'soon'};if(n===1)return{t:'Tomorrow',c:'soon'};
  if(n<7)return{t:parseYmd(due).toLocaleDateString(undefined,{weekday:'short'}),c:''};
  return{t:parseYmd(due).toLocaleDateString(undefined,{month:'short',day:'numeric'}),c:''}}
const isoDay=iso=>iso?ymd(new Date(iso)):null;

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const tasks=()=>Object.values(S.tasks);
const openTasks=()=>tasks().filter(t=>t.status!=='done');
const projects=()=>Object.values(S.projects).filter(p=>!p.archived).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const warnOf=t=>t.warn!=null&&t.warn!==''?+t.warn:({1:7,2:3,3:1}[t.priority||3]);
const projOf=t=>t.projectId?S.projects[t.projectId]:null;
const catOfProject=p=>CATS.includes(p?.area)?p.area:null;
const catOf=t=>catOfProject(projOf(t))||(CATS.includes(t.cat)?t.cat:null);
const inArea=t=>S.area==='All'||catOf(t)===S.area;
const pInArea=p=>S.area==='All'||catOfProject(p)===S.area;
const catDot=c=>c?`<i class="pdot" style="background:var(${CATVAR[c]})"></i>`:'';
const matchCat=w=>CATS.find(c=>c.toLowerCase().startsWith(w.toLowerCase()))||null;

function findProject(word){const w=norm(word);if(!w)return null;const ps=projects();
  return ps.find(p=>norm(p.name)===w)||ps.find(p=>norm(p.name).startsWith(w))||ps.find(p=>norm(p.name).includes(w))||null}

/* ---------- recurrence ---------- */
function recurLabel(t){if(!t.recur)return'';if(t.recur==='custom')return 'Every '+(t.recurDays||[]).map(d=>DOWL[d]).join(', ');return(RECURS.find(r=>r[0]===t.recur)||['',''])[1]}
function matchesRecur(t,s){const dw=parseYmd(s).getDay();if(t.recur==='weekdays')return dw>0&&dw<6;if(t.recur==='custom')return(t.recurDays||[]).includes(dw);return true}
function nextDue(t){const td=today();const base=t.due&&t.due>td?t.due:td;
  if(t.recur==='daily')return addDays(base,1);if(t.recur==='weekly')return addDays(base,7);if(t.recur==='biweekly')return addDays(base,14);
  if(t.recur==='monthly'){const d=parseYmd(base);d.setMonth(d.getMonth()+1);return ymd(d)}
  for(let i=1;i<=7;i++){const x=addDays(base,i);if(matchesRecur(t,x))return x}return addDays(base,7)}
function firstDue(t){const td=today();if(t.recur==='weekdays'||t.recur==='custom'){for(let i=0;i<7;i++){const x=addDays(td,i);if(matchesRecur(t,x))return x}}return td}

/* ---------- quick add parser ---------- */
function parseQuick(text){
  let t=' '+text+' ';const o={priority:3,size:'M'};const td=today();
  t=t.replace(/\s\+(\w+)(?=\s)/g,(m,w)=>{const c=matchCat(w);if(c){o.cat=c;return ' '}return m});
  t=t.replace(/\s#([\w-]+)/g,(m,w)=>{const p=findProject(w);if(p)o.projectId=p.id;else o.newProject=w.replace(/[-_]/g,' ');return ' '});
  t=t.replace(/\s!([123])(?=\s)/g,(m,n)=>{o.priority=+n;return ' '});
  t=t.replace(/\s\*([sml])(?=\s)/gi,(m,z)=>{o.size=z.toUpperCase();return ' '});
  t=t.replace(/\s@wait(ing)?(?=\s)/gi,()=>{o.status='waiting';return ' '});
  t=t.replace(/\severy((?:[\s,]+(?:and\s+)?(?:sun|mon|tue|wed|thu|fri|sat)[a-z]*)+)(?=\s)/i,(m,days)=>{
    const ds=[...new Set((days.toLowerCase().match(/sun|mon|tue|wed|thu|fri|sat/g)||[]).map(d=>DOWS.indexOf(d)))].sort();o.recur='custom';o.recurDays=ds;return ' '});
  t=t.replace(/\s(every\s?day|daily|weekdays|every\s?weekday|every\s?2\s?weeks|biweekly|every\s?other\s?week|every\s?week|weekly|every\s?month|monthly)(?=\s)/i,(m,w)=>{const x=w.toLowerCase().replace(/\s/g,'');
    o.recur=x.includes('weekday')?'weekdays':x.includes('2')||x.includes('other')||x==='biweekly'?'biweekly':x.includes('day')||x==='daily'?'daily':x.includes('month')?'monthly':'weekly';return ' '});
  const setDue=d=>{o.due=d;return ' '};
  t=t.replace(/\s(\d{4}-\d{2}-\d{2})(?=\s)/,(m,d)=>setDue(d));
  t=t.replace(/\s(today|tod|tonight)(?=\s)/i,()=>setDue(td));
  t=t.replace(/\s(tomorrow|tmr|tmrw)(?=\s)/i,()=>setDue(addDays(td,1)));
  t=t.replace(/\snext week(?=\s)/i,()=>{const k=(parseYmd(td).getDay()+6)%7;return setDue(addDays(td,7-k))});
  t=t.replace(/\sin (\d+) ?(d|days?|w|wks?|weeks?)(?=\s)/i,(m,n,u)=>setDue(addDays(td,+n*(u[0].toLowerCase()==='w'?7:1))));
  t=t.replace(/\s(?:on |by )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*(?=\s)/i,(m,d)=>{const target=DOWS.indexOf(d.toLowerCase());let n=(target-parseYmd(td).getDay()+7)%7;if(n===0)n=7;return setDue(addDays(td,n))});
  t=t.replace(/\s(?:on |by )?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]* (\d{1,2})(?=\s)/i,(m,mo,d)=>{const now=new Date();let dt=new Date(now.getFullYear(),MONTHS.indexOf(mo.toLowerCase()),+d);if(ymd(dt)<td)dt.setFullYear(dt.getFullYear()+1);return setDue(ymd(dt))});
  o.title=t.trim().replace(/\s+/g,' ');
  if(o.recur&&!o.due)o.due=firstDue(o);
  if(!o.status)o.status=(o.projectId||o.newProject||o.due||o.cat)?'next':'inbox';
  return o}

/* ---------- persistence ---------- */
const queues={};
function queue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn).catch(e=>{
  toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete some old projects or tasks, then try again.':'Could not save that change. Check your connection and try again.')});queues[path]=p;return p}
const local={load(){try{return JSON.parse(localStorage.getItem('qd-local')||'null')}catch{return null}},
  save(){try{localStorage.setItem('qd-local',JSON.stringify({projects:S.projects,tasks:S.tasks,meta:S.meta}))}catch{}}};
function persist(col,id,obj){if(!S.db){local.save();return}const body={...obj};delete body.id;const path=col+'/'+id;queue(path,()=>S.db.doc(path).set(body))}
function persistDel(col,id){if(!S.db){local.save();return}const path=col+'/'+id;queue(path,()=>S.db.doc(path).delete())}
function saveTask(t){S.tasks[t.id]={...t};persist('tasks',t.id,t);render()}
function deleteTask(id){delete S.tasks[id];persistDel('tasks',id);render()}
function saveProject(p){S.projects[p.id]={...p};persist('projects',p.id,p);render()}
function deleteProject(id){delete S.projects[id];persistDel('projects',id);render()}
function saveMeta(patch){S.meta={...S.meta,...patch};if(!S.db){local.save()}else{const m={...S.meta};queue('meta/state',()=>S.db.doc('meta/state').set(m))}render()}

/* ---------- motivation engine ---------- */
// Variable rewards: every finished task opens a chest. Most are small, some are big, a few are jackpots.
function rollOnce(){const r=Math.random();
  if(r<.015)return{tier:'legendary',tokens:15,ticket:true};
  if(r<.07)return{tier:'epic',tokens:10};
  if(r<.24)return{tier:'rare',tokens:5};
  if(r<.6)return{tier:'common',tokens:2};
  return{tier:'common',tokens:1}}
function roll(lucky){let a=rollOnce();if(lucky){const b=rollOnce();if(TIERRANK[b.tier]>TIERRANK[a.tier]||(b.tier===a.tier&&b.tokens>a.tokens))a=b}return a}
function comboNow(){const cut=Date.now()-COMBO_MIN*60000;const last=tasks().filter(t=>t.status==='done'&&t.doneAt&&+new Date(t.doneAt)>cut).sort((a,b)=>a.doneAt<b.doneAt?1:-1)[0];
  return last?{n:last.loot?.combo||1,until:+new Date(last.doneAt)+COMBO_MIN*60000}:null}
const comboMult=n=>n>=5?3:n>=3?2:1;

function plannedToday(){const td=today();
  return tasks().filter(t=>(t.mustWinOn===td||t.todayOn===td||(t.due&&t.due<=td&&t.status!=='inbox'&&(t.status!=='done'||isoDay(t.doneAt)===td)))&&(t.status!=='done'||isoDay(t.doneAt)===td))}
function dayNumbers(){const td=today();const planned=plannedToday();const doneToday=tasks().filter(t=>t.status==='done'&&isoDay(t.doneAt)===td);
  const target=Math.max(3,planned.length);return{planned,doneToday,target,closed:doneToday.length>=target}}

function stats(){const done=tasks().filter(t=>t.status==='done');const td=today();
  const byDay={};done.forEach(t=>{const d=isoDay(t.doneAt);if(d)(byDay[d]=byDay[d]||[]).push(t)});
  const days=Object.keys(byDay).sort();
  // "Never miss twice": one empty day is a rest day; two in a row ends the streak.
  let streak=0,miss=0,d=byDay[td]?td:addDays(td,-1);
  if(days.length)while(d>=days[0]){if(byDay[d]){streak++;miss=0}else{miss++;if(miss>=2)break}d=addDays(d,-1)}
  const yesterdayMiss=!byDay[addDays(td,-1)];
  const atRisk=streak>0&&!byDay[td]&&yesterdayMiss;
  const bonus=(S.meta.bonuses||[]);
  const earned=done.reduce((s,t)=>s+(t.loot?.tokens||0),0)+bonus.reduce((s,b)=>s+(b.tokens||0),0);
  const spent=(S.meta.spent||[]).reduce((s,x)=>s+(x.ticket?0:(x.cost||0)),0);
  const tickets=done.filter(t=>t.loot?.ticket).length+bonus.filter(b=>b.ticket).length-(S.meta.spent||[]).filter(x=>x.ticket).length;
  return{streak,atRisk,todayDone:(byDay[td]||[]).length,tokens:earned-spent,tickets,byDay}}

function projectInfo(p){const ts=tasks().filter(t=>t.projectId===p.id);const open=ts.filter(t=>t.status!=='done');const next=open.filter(t=>t.status==='next');
  const stamps=ts.flatMap(t=>[t.createdAt,t.doneAt]).filter(Boolean).concat(p.createdAt||[]).map(isoDay).filter(Boolean).sort();
  const last=stamps[stamps.length-1];const idle=last?diffDays(today(),last):0;
  const left=p.deadline?diffDays(p.deadline,today()):null;
  let health=['On track','ok'];
  if(ts.length&&!open.length)health=['Defeated','info'];
  else if(left!=null&&left<0)health=['Past deadline','critical'];
  else if(left!=null&&open.length>Math.max(1,left))health=['At risk','critical'];
  else if(!next.length)health=['No next step','warning'];
  else if(idle>=7)health=['Stalled '+idle+'d','warning'];
  return{ts,open,next,idle,left,health}}

function radar(){const td=today();const items=[];
  openTasks().filter(inArea).forEach(t=>{
    if(t.carried>=2)items.push({sev:'warning',tag:'Avoiding',msg:t.title,sub:`Pushed to tomorrow ${t.carried} times. It is probably too big or unclear. Split it into a 10-minute first step, or drop it.`,task:t.id,rank:.8});
    if(!t.due||t.status==='inbox')return;const n=diffDays(t.due,td);
    if(n<0)items.push({sev:'critical',tag:'Overdue',msg:t.title,sub:`Was due ${fmtDate(t.due)}. Do it, reschedule it, or drop it.`,task:t.id,rank:0+n/1000});
    else if(n<=warnOf(t)&&n>0&&t.todayOn!==td&&t.mustWinOn!==td&&!t.recur)items.push({sev:'warning',tag:'Heads-up',msg:t.title,sub:`Due ${fmtDate(t.due)}, ${n} day${n>1?'s':''} out. Start it now so it is not a last-minute surprise.`,task:t.id,act:'today',rank:1+n/100})});
  openTasks().filter(inArea).filter(t=>t.status==='waiting').forEach(t=>{const since=isoDay(t.waitingSince||t.createdAt);const n=since?diffDays(td,since):0;
    if(n>=4)items.push({sev:'warning',tag:'Follow up',msg:t.title,sub:`Waiting on ${t.waitingOn||'someone'} for ${n} days. Send a nudge.`,task:t.id,rank:2})});
  projects().filter(pInArea).forEach(p=>{const i=projectInfo(p);
    if(i.health[1]==='critical')items.push({sev:'critical',tag:i.health[0],msg:p.name,sub:i.left<0?`Deadline passed ${-i.left}d ago with ${i.open.length} tasks open.`:`${i.open.length} tasks left and ${i.left} days to the deadline.`,project:p.id,rank:.5});
    else if(i.health[0]==='No next step')items.push({sev:'warning',tag:'Stuck',msg:p.name,sub:'No next action. Add the very next physical step.',project:p.id,rank:3});
    else if(i.health[1]==='warning')items.push({sev:'info',tag:'Stalled',msg:p.name,sub:`Nothing moved in ${i.idle} days. Still important? Touch it or archive it.`,project:p.id,rank:4})});
  const inbox=openTasks().filter(t=>t.status==='inbox').length;
  if(inbox>=8)items.push({sev:'info',tag:'Inbox',msg:`${inbox} unsorted items`,sub:'Process the inbox so nothing hides in there.',view:'inbox',rank:5});
  const lr=(S.meta.reviews||[]).slice(-1)[0];const since=lr?diffDays(td,lr):null;
  if(since==null||since>=7)items.push({sev:since==null||since>=10?'warning':'info',tag:'Review',msg:'Weekly review is due',sub:since==null?'Do your first one. It takes 20 minutes and opens an Epic chest.':`Last one was ${since} days ago.`,view:'review',rank:6});
  if(S.area==='All'){const ws=weekStart();const wk=tasks().filter(t=>t.status==='done'&&isoDay(t.doneAt)>=ws);const quiet=CATS.filter(c=>projects().some(p=>p.area===c)&&!wk.some(t=>catOf(t)===c));
    if(wk.length>=5&&quiet.length)items.push({sev:'info',tag:'Balance',msg:`${quiet.join(' and ')} got nothing done this week`,sub:'Pick one small task there for tomorrow so it does not quietly fall apart.',rank:7})}
  return items.sort((a,b)=>a.rank-b.rank)}

/* ---------- sound + haptics ---------- */
let actx=null;
function tone(freqs,dur=.09,gap=.07){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
  freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
    const s=t0+i*gap;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.18,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+dur+.15);o.start(s);o.stop(s+dur+.2)})}catch{}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch{}}
function chestSound(tier,combo){const base=523*Math.pow(1.06,Math.min(combo-1,8));
  if(tier==='common')tone([base,base*1.5]);else if(tier==='rare')tone([base,base*1.25,base*1.5]);
  else if(tier==='epic')tone([base,base*1.25,base*1.5,base*2],.12,.08);else tone([base,base*1.25,base*1.5,base*2,base*2.5,base*3],.16,.09)}

/* ---------- actions ---------- */
function addFromText(text,extra={}){const o=parseQuick(text);if(!o.title)return;
  if(o.newProject){const cat=o.cat||(S.area==='All'?'Personal':S.area);const p={id:'p_'+uid(),name:o.newProject.replace(/\b\w/g,c=>c.toUpperCase()),area:cat,color:COLORS[projects().length%6],createdAt:new Date().toISOString()};saveProject(p);o.projectId=p.id;toast(`New ${cat} project <b>${esc(p.name)}</b> created`)}
  delete o.newProject;
  if(!o.cat&&!o.projectId&&S.area!=='All')o.cat=S.area;
  const t={id:'t_'+uid(),createdAt:new Date().toISOString(),...o,...extra};
  if(extra.projectId&&t.status==='inbox')t.status='next';
  if(t.status==='waiting')t.waitingSince=new Date().toISOString();
  saveTask(t);return t}

function completeTask(id,ev){const t=S.tasks[id];if(!t)return;const prev={...t};const td=today();
  if(t.status==='done'){saveTask({...t,status:t.prevStatus||'next',doneAt:null,loot:null});return}
  const c=comboNow();const combo=c?c.n+1:1;const mult=comboMult(combo);
  const lucky=t.mustWinOn===td||(t.due&&diffDays(t.due,td)>warnOf(t));
  const r=roll(lucky);const loot={tier:r.tier,tokens:r.tokens*mult,ticket:!!r.ticket,combo};
  const ringBefore=dayNumbers().closed;
  saveTask({...t,prevStatus:t.status,status:'done',doneAt:new Date().toISOString(),loot,carried:0});
  let spawned=null;
  if(t.recur){spawned={...t,id:'t_'+uid(),due:nextDue(t),status:'next',createdAt:new Date().toISOString(),todayOn:null,mustWinOn:null,doneAt:null,loot:null,carried:0};delete spawned.prevStatus;saveTask(spawned)}
  chestSound(r.tier,combo);buzz(r.tier==='common'?15:[20,40,30]);
  const why=[lucky?(t.mustWinOn===td?'must-win luck':'early-bird luck'):null,mult>1?`combo ×${mult}`:null].filter(Boolean).join(' · ');
  if(TIERRANK[r.tier]>=1){burst(ev,r.tier!=='rare');showChest(r.tier,loot.tokens,loot.ticket,why)}
  else burst(ev,false);
  toast(`<b>+${loot.tokens} token${loot.tokens>1?'s':''}</b> ${TIERS[r.tier]} chest${combo>1?` · combo ${combo}`:''}${why&&TIERRANK[r.tier]<1?' · '+why:''}`,()=>{saveTask(prev);if(spawned)deleteTask(spawned.id)});
  const dn=dayNumbers();
  if(!ringBefore&&dn.closed&&!(S.meta.ringDays||[]).includes(td)){
    const b={at:new Date().toISOString(),tokens:10,ticket:Math.random()<.25,why:'Ring closed'};
    saveMeta({ringDays:[...(S.meta.ringDays||[]),td].slice(-60),bonuses:[...(S.meta.bonuses||[]),b]});
    setTimeout(()=>{showChest('epic',b.tokens,b.ticket,'You closed today\'s ring');burst(null,true);tone([523,659,784,1047,1319],.18,.1)},900)}
  const wins=tasks().filter(x=>x.mustWinOn===td);
  if(t.mustWinOn===td&&wins.length>=3&&wins.every(x=>x.status==='done'))setTimeout(()=>toast('<b>All 3 must-wins done.</b> That is what a good day looks like.'),1600)}

function toggleMustWin(id){const t=S.tasks[id];const td=today();
  if(t.mustWinOn===td){saveTask({...t,mustWinOn:null});return}
  const n=tasks().filter(x=>x.mustWinOn===td).length;
  if(n>=3){toast('You already have 3 must-wins today. Unstar one first. Three is the limit on purpose.');return}
  saveTask({...t,mustWinOn:td,todayOn:td,status:t.status==='inbox'?'next':t.status})}
function toggleToday(id){const t=S.tasks[id];const td=today();saveTask({...t,todayOn:t.todayOn===td?null:td,status:t.status==='inbox'?'next':t.status})}
function pushTomorrow(id){const t=S.tasks[id];const tm=addDays(today(),1);
  const n={...t,todayOn:tm,mustWinOn:null,carried:(t.carried||0)+1};if(t.due&&t.due<=today())n.due=tm;saveTask(n)}

/* ---------- render ---------- */
let raf=0;function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;draw()})}
function draw(){
  const inboxN=openTasks().filter(t=>t.status==='inbox').length;
  const overdue=openTasks().filter(t=>t.due&&t.due<today()&&t.status!=='inbox').length;
  document.getElementById('tabs').innerHTML=VIEWS.map(([k,l,ic])=>{const c=k==='inbox'?inboxN:k==='today'?overdue:0;
    return `<button data-view="${k}" ${S.view===k?'aria-current="page"':''}>${ic}<span>${l}</span>${c?`<span class="count ${k==='today'?'hot':''}">${c}</span>`:''}</button>`}).join('');
  const sync={connecting:['','Connecting…'],sync:['ok','Synced across devices'],slow:['warn','Saved copy · reconnecting'],local:['warn','This device only']}[S.mode];
  document.getElementById('sync').innerHTML=`<span class="dot ${sync[0]}"></span>${sync[1]}`;
  const counts={};CATS.forEach(c=>counts[c]=openTasks().filter(t=>catOf(t)===c&&t.status!=='someday').length);
  document.getElementById('cats').innerHTML=['All',...CATS].map(c=>`<button class="cat" data-act="area" data-id="${c}" aria-pressed="${S.area===c}">${c!=='All'?`<i style="background:var(${CATVAR[c]})"></i>`:''}${c}${c!=='All'?`<span class="n">${counts[c]}</span>`:''}</button>`).join('');
  drawHud();
  const v=document.getElementById('view');
  const html={today:viewToday,inbox:viewInbox,projects:viewProjects,upcoming:viewUpcoming,review:viewReview}[S.view]();
  const banner='';
  v.innerHTML=banner+html}

function drawHud(){const st=stats();const dn=dayNumbers();const c=comboNow();
  const pct=Math.min(1,dn.doneToday.length/dn.target);const C=2*Math.PI*32;
  const hr=new Date().getHours();const greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const left=Math.max(0,dn.target-dn.doneToday.length);
  const line=dn.closed?'<b>Ring closed.</b> Everything past this is extra credit.':left===1?'<b>1 task</b> left to close today\'s ring.':`<b>${left} tasks</b> left to close today's ring.`;
  const streakTxt=st.atRisk?'finish 1 task today or it resets':!st.todayDone&&st.streak?'not counted yet today':'';
  document.getElementById('hud').innerHTML=`
   <div class="ring ${dn.closed?'closed':''}" role="img" aria-label="${dn.doneToday.length} of ${dn.target} done today">
     <svg viewBox="0 0 76 76"><circle class="trk" cx="38" cy="38" r="32"/><circle class="val" cx="38" cy="38" r="32" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
     <div class="num"><div><b>${dn.doneToday.length}/${dn.target}</b><small>today</small></div></div></div>
   <div class="hud-main">
     <div class="hud-title">${greet}</div>
     <div class="hud-line">${line}</div>
     <div class="hud-stats">
       <span class="stat flame ${st.todayDone?'lit':st.atRisk?'risk':''}">${ICON.flame}<b>${st.streak}</b> day streak${streakTxt&&st.atRisk?' · '+streakTxt:''}</span>
       ${c?`<span class="stat combo">${ICON.bolt}Combo ${c.n}${comboMult(c.n+1)>1?` · next ×${comboMult(c.n+1)}`:` · ${3-c.n} more for ×2`} · <span class="mono" data-until="${c.until}"></span></span>`:''}
     </div>
   </div>
   <button class="wallet" data-act="rewards" aria-label="Open rewards"><span class="coin">T</span><span><b>${st.tokens}</b><small>tokens${st.tickets>0?` · ${st.tickets} ticket${st.tickets>1?'s':''}`:''}</small></span></button>`;
  tickCombo()}
function tickCombo(){document.querySelectorAll('[data-until]').forEach(el=>{const ms=+el.dataset.until-Date.now();if(ms<=0){render();return}const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);el.textContent=`${m}:${pad(s)} left`})}
setInterval(tickCombo,1000);

function taskRow(t,opts={}){const td=today();const p=projOf(t);const done=t.status==='done';const cat=catOf(t);
  const meta=[];
  if(!opts.hideProject){if(p)meta.push(`<span>${catDot(cat)}${esc(p.name)}</span>`);else if(cat)meta.push(`<span>${catDot(cat)}${cat}</span>`)}
  if(t.due&&!done){const d=dueLabel(t.due);meta.push(`<span class="${d.c}">${ICON.clock}${d.t}</span>`)}
  if(t.status==='waiting')meta.push(`<span>${ICON.wait}Waiting on ${esc(t.waitingOn||'someone')}</span>`);
  if(t.recur)meta.push(`<span>${ICON.repeat}${esc(recurLabel(t))}</span>`);
  if(done&&t.loot)meta.push(`<span class="tier t-${t.loot.tier}">${TIERS[t.loot.tier]} · +${t.loot.tokens}</span>`);
  if(!done&&t.carried>=2)meta.push(`<span class="late">moved ${t.carried}×</span>`);
  return `<div class="row ${done?'done':''}"${opts.bare?' style="padding:0;border:0"':''}>
    <button class="check p${t.priority||3}" data-act="done" data-id="${t.id}" aria-label="${done?'Mark not done':'Complete'}: ${esc(t.title)}">${ICON.check}</button>
    <div class="body"><button class="title" data-act="edit" data-id="${t.id}">${esc(t.title)}</button>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div>
    ${done?'':`<div class="acts">${opts.today===false?'':`<button class="ib today ${t.todayOn===td?'on':''}" data-act="today" data-id="${t.id}" aria-label="Plan for today" title="Plan for today">${ICON.sun}</button>`}
      <button class="ib ${t.mustWinOn===td?'on':''}" data-act="win" data-id="${t.id}" aria-label="Make a must-win" title="Must-win (max 3 a day, luckier chests)">${ICON.star}</button></div>`}
  </div>`}
const sortTasks=a=>a.sort((x,y)=>(x.priority||3)-(y.priority||3)||((x.due||'9999')<(y.due||'9999')?-1:(x.due||'9999')>(y.due||'9999')?1:0));
const listOf=(ts,o)=>`<div class="list">${ts.map(t=>taskRow(t,o)).join('')}</div>`;

function alertRow(a){const btn=a.task?(a.act==='today'?`<button class="btn sm" data-act="today" data-id="${a.task}">Start today</button>`:`<button class="btn sm" data-act="edit" data-id="${a.task}">Open</button>`)
   :a.project?`<button class="btn sm" data-act="open-project" data-id="${a.project}">Open</button>`:a.view?`<button class="btn sm" data-view="${a.view}">Go</button>`:'';
  return `<div class="alert ${a.sev}"><span class="tag">${esc(a.tag)}</span><div class="msg">${esc(a.msg)}<small>${esc(a.sub)}</small></div>${btn}</div>`}

/* ---------- end-of-day report ---------- */
function dayReport(){const td=today();const dn=dayNumbers();const done=dn.doneToday;const planned=dn.planned;
  const openPlanned=sortTasks(planned.filter(t=>t.status!=='done'));
  const plannedDone=planned.filter(t=>t.status==='done').length;
  const wins=tasks().filter(t=>t.mustWinOn===td);const winsDone=wins.filter(t=>t.status==='done').length;
  const overdue=openTasks().filter(t=>t.due&&t.due<td&&t.status!=='inbox');
  const slipping=openTasks().filter(t=>t.carried>=2);
  const soon=sortTasks(openTasks().filter(t=>t.due&&t.due>td&&diffDays(t.due,td)<=3));
  const ratio=planned.length?plannedDone/planned.length:(done.length?1:0);
  let verdict,sub;
  if(!done.length){verdict='Nothing got finished today.';sub='No judgement, but that is the honest number. One small task before bed keeps your streak alive and makes tomorrow easier to start.'}
  else if(ratio>=1&&openPlanned.length===0){verdict=`You did everything you planned. ${done.length} done.`;sub='That is rare. Close the day and enjoy it.'}
  else if(ratio>=.6){verdict=`Solid day: ${plannedDone} of ${planned.length} planned, ${done.length} done in total.`;sub=`${openPlanned.length} still open. Move them to tomorrow on purpose, or drop the ones that do not matter.`}
  else{verdict=`Honest take: you planned ${planned.length} and finished ${plannedDone}.`;sub='The plan was bigger than the day. Tomorrow, plan fewer things and make the first one small enough to start in 2 minutes.'}
  if(wins.length&&winsDone<wins.length)sub+=` Must-wins: ${winsDone} of ${wins.length}.`;
  const byCat=CATS.map(c=>({c,done:done.filter(t=>catOf(t)===c).length,open:openPlanned.filter(t=>catOf(t)===c).length}));
  const closed=S.meta.reports?.[td]?.closed;
  return{td,done,planned,openPlanned,plannedDone,wins,winsDone,overdue,slipping,soon,verdict,sub,byCat,closed}}

function reportHtml(){const r=dayReport();const max=Math.max(1,...r.byCat.map(x=>x.done+x.open));
  return `<section class="report" id="report">
    <div><div class="eyebrow">Day report · ${fmtDate(r.td)}</div><div class="verdict" style="margin-top:6px">${esc(r.verdict)}</div><div class="verdict-sub">${esc(r.sub)}</div></div>
    <div class="score"><div><b>${r.done.length}</b><small>finished</small></div><div><b>${r.openPlanned.length}</b><small>planned, not done</small></div><div><b style="color:${r.overdue.length?'var(--danger)':'inherit'}">${r.overdue.length}</b><small>overdue overall</small></div><div><b>${r.wins.length?r.winsDone+'/'+r.wins.length:'–'}</b><small>must-wins</small></div></div>
    <div class="catbars">${r.byCat.map(x=>`<div class="catbar"><span>${catDot(x.c)} ${x.c}</span><div class="bar"><i style="width:${(x.done)/max*100}%;background:var(${CATVAR[x.c]})"></i></div><span class="mono" style="color:var(--muted)">${x.done} / ${x.done+x.open}</span></div>`).join('')}</div>
    ${r.openPlanned.length?`<div class="sec-head"><h2 style="font-size:15px">Still open from today</h2><button class="btn sm" data-act="all-tomorrow">Move all to tomorrow</button></div>
      <div class="list">${r.openPlanned.map(t=>`<div class="row" style="flex-wrap:wrap"><div class="body"><button class="title" data-act="edit" data-id="${t.id}">${esc(t.title)}</button><div class="meta">${catOf(t)?`<span>${catDot(catOf(t))}${catOf(t)}</span>`:''}${t.carried?`<span class="${t.carried>=2?'late':''}">moved ${t.carried}× already</span>`:''}</div></div>
        <div class="acts" style="gap:6px"><button class="btn sm" data-act="done" data-id="${t.id}">Done</button><button class="btn sm" data-act="tomorrow" data-id="${t.id}">Tomorrow</button><button class="btn sm ghost" data-act="edit" data-id="${t.id}">Reschedule</button><button class="btn sm ghost" data-act="drop" data-id="${t.id}">Drop</button></div></div>`).join('')}</div>`:''}
    ${r.slipping.length?`<div class="empty-note solid"><b style="color:var(--warn)">Slipping:</b> ${r.slipping.map(t=>esc(t.title)).join(' · ')}. These keep getting pushed. Make each one smaller, or decide to drop it.</div>`:''}
    ${r.soon.length?`<div class="empty-note solid"><b>Coming up in 3 days:</b> ${r.soon.map(t=>`${esc(t.title)} (${dueLabel(t.due).t})`).join(' · ')}</div>`:''}
    <div id="coach-box">${S.coach?`<div class="coach">${esc(S.coach)}</div>`:''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${r.closed?`<span class="allclear" style="padding:8px 12px">${ICON.check} Day closed</span>`:`<button class="btn primary" data-act="close-day">${ICON.moon}Close my day · open a chest</button>`}
      <button class="btn" data-act="coach" id="coach-btn">Get a coach's honest take</button>
      ${S.showReport?`<button class="btn ghost" data-act="hide-report">Hide</button>`:''}
    </div></section>`}

function viewToday(){const td=today();
  if(S.mode==='connecting')return `<div class="empty-note">Loading your quests…</div>`;
  if(!tasks().length&&!projects().length)return `<div class="empty-note"><b>Your deck is empty.</b> Type everything on your mind into the box above, one item at a time. Add <code>+work</code>, <code>+personal</code> or <code>+ministry</code> to file it, and a date like <code>fri</code> to schedule it. Unsorted items land in the Inbox.</div>`;
  const rd=radar();const wins=tasks().filter(t=>t.mustWinOn===td&&inArea(t));
  const winSlots=wins.slice(0,3).map((t,i)=>`<div class="win ${t.status==='done'?'won':''}"><span class="slot">MUST-WIN ${i+1}</span>${taskRow(t,{today:false,bare:true})}</div>`).join('');
  const todayList=sortTasks(openTasks().filter(inArea).filter(t=>t.mustWinOn!==td&&(t.todayOn===td||(t.due&&t.due<=td&&t.status!=='inbox'))));
  const suggest=sortTasks(openTasks().filter(inArea).filter(t=>t.status==='next'&&t.todayOn!==td&&t.mustWinOn!==td&&!(t.due&&t.due<=td))).slice(0,3);
  const doneToday=tasks().filter(inArea).filter(t=>t.status==='done'&&isoDay(t.doneAt)===td);
  const evening=new Date().getHours()>=18;const closed=S.meta.reports?.[td]?.closed;
  const showRep=S.showReport||(evening&&!closed);
  return `${showRep?reportHtml():''}
   ${rd.length?`<section><div class="sec-head"><h2>Heads-up</h2>${rd.length>2?`<span class="sub">+${rd.length-2} more</span>`:''}</div>
     <div class="radar">${rd.slice(0,2).map(alertRow).join('')}</div></section>`:''}
   ${winSlots?`<section><div class="sec-head"><h2>Must-wins</h2></div><div class="wins">${winSlots}</div></section>`:''}
   ${todayList.length?`<section><div class="sec-head"><h2>Today</h2></div>${listOf(todayList)}</section>`:''}
   ${suggest.length?`<section><div class="sec-head"><h2>Up next</h2><button class="btn sm" data-act="lucky">Pick one for me</button></div>${listOf(suggest)}</section>`:''}
   ${doneToday.length?`<section><div class="sec-head"><h2>Done today</h2><span class="sub">${doneToday.reduce((s,t)=>s+(t.loot?.tokens||0),0)} tokens earned</span></div>${listOf(doneToday)}</section>`:''}
   ${showRep?'':`<div><button class="btn ghost" data-act="show-report">${ICON.moon}End my day</button></div>`}`}

function bossCard(p){const i=projectInfo(p);const total=i.ts.length;const pct=total?i.open.length/total*100:100;const c=catOfProject(p);

  const ps=projects().filter(pInArea);
  const groups=S.area==='All'?[...CATS,null]:[S.area];

function viewProject(p){const i=projectInfo(p);const groups=[['next','Next actions'],['waiting','Waiting for'],['inbox','Unsorted'],['someday','Someday']];const c=catOfProject(p);
  const done=i.ts.filter(t=>t.status==='done').sort((a,b)=>(b.doneAt||'')>(a.doneAt||'')?1:-1);

function viewUpcoming(){const td=today();const days=[];const open=openTasks().filter(inArea).filter(t=>t.status!=='inbox');
  const overdue=sortTasks(open.filter(t=>t.due&&t.due<td));
  for(let n=0;n<14;n++){const d=addDays(td,n);
    const due=sortTasks(open.filter(t=>t.due===d));
    const starts=open.filter(t=>t.due&&t.due>d&&!t.recur&&addDays(t.due,-warnOf(t))===d&&n>0);
    const dl=projects().filter(p=>p.deadline===d&&pInArea(p));
    if(n<2||due.length||starts.length||dl.length)days.push({d,n,due,starts,dl})}
  const undated=open.filter(t=>!t.due&&t.status==='next').length;
  const recurring=sortTasks(openTasks().filter(inArea).filter(t=>t.recur));
  return `<section><div class="sec-head"><h2>Next 14 days</h2><span class="sub">Orange lines mark the day you should start</span></div>
   ${overdue.length?`<div class="day"><h3><b style="color:var(--danger)">Overdue</b>${overdue.length}</h3>${listOf(overdue)}</div>`:''}
   ${days.map(x=>`<div class="day"><h3><b>${x.n===0?'Today':x.n===1?'Tomorrow':parseYmd(x.d).toLocaleDateString(undefined,{weekday:'long'})}</b>${parseYmd(x.d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</h3>
     ${x.dl.map(p=>`<div class="marker deadline">Project deadline: ${esc(p.name)}</div>`).join('')}
     ${x.starts.map(t=>`<div class="marker">Start "${esc(t.title)}" today. It is due ${fmtDate(t.due)}.</div>`).join('')}
     ${x.due.length?listOf(x.due):(!x.dl.length&&!x.starts.length?`<div style="font-size:13px;color:var(--muted)">Nothing due</div>`:'')}</div>`).join('')}
   <div style="color:var(--muted);font-size:13px">${undated} next actions have no date. That is fine. Not everything needs one.</div></section>
   <section><div class="sec-head"><h2>Recurring tasks</h2><button class="btn sm primary" data-act="new-recurring">New recurring task</button></div>
     ${recurring.length?`<div class="list">${recurring.map(t=>`<div class="row"><span style="color:var(--muted);margin-top:2px">${ICON.repeat}</span><div class="body"><button class="title" data-act="edit" data-id="${t.id}">${esc(t.title)}</button>
       <div class="meta"><span>${esc(recurLabel(t))}</span>${catOf(t)?`<span>${catDot(catOf(t))}${catOf(t)}</span>`:''}${t.due?`<span>next ${dueLabel(t.due).t}</span>`:''}</div></div></div>`).join('')}</div>`
     :`<div class="empty-note">No recurring tasks yet. Type something like <code>Pay rent monthly +personal</code>, <code>Gym every mon wed fri</code> or <code>Team standup weekdays +work</code>.</div>`}</section>`}

function viewReview(){const ws=weekStart();const checks=S.meta.checks?.week===ws?S.meta.checks.done||[]:[];
  const outs=S.meta.outcomes?.week===ws?S.meta.outcomes.items:['','',''];
  const inbox=openTasks().filter(t=>t.status==='inbox').length;
  const stuck=projects().filter(p=>projectInfo(p).health[0]==='No next step').length;
  const waiting=openTasks().filter(t=>t.status==='waiting').length;
  const doneThisWeek=(S.meta.reviews||[]).some(d=>d>=ws);
  const steps=[['Brain dump','Capture every open loop: emails, promises, ideas, worries.'],
    ['Process the inbox',inbox?`${inbox} items still unsorted.`:'Inbox is at zero.'],
    ['Give every project a next step',stuck?`${stuck} project${stuck>1?'s have':' has'} no next action.`:'Every project has a next step.'],
    ['Check what you are waiting on',waiting?`${waiting} item${waiting>1?'s':''} waiting on other people. Nudge the slow ones.`:'Nothing waiting on others.'],
    ['Look two weeks ahead','Open Upcoming and your calendar. Start anything big now.'],
    ['Check the balance','Did Work, Personal and Ministry each get attention? Plan one thing for whichever got none.'],
    ['Pick next week\'s 3 outcomes','Write them below. They guide your daily must-wins.']];
  // last 7 days, planned vs done
  const st=stats();const td=today();const reps=S.meta.reports||{};
  const days=[...Array(7)].map((_,i)=>{const d=addDays(td,i-6);const done=(st.byDay[d]||[]).length;const planned=d===td?dayNumbers().planned.length:(reps[d]?.planned??null);return{d,done,planned}});
  const max=Math.max(3,...days.map(x=>Math.max(x.done,x.planned||0)));
  const wk=tasks().filter(t=>t.status==='done'&&isoDay(t.doneAt)>=ws);
  const closedDays=Object.values(reps).filter(r=>r.closed).length;
  return `<section><div class="sec-head"><h2>Last 7 days</h2><span class="sub">The honest trend</span></div>
    <div class="report" style="border-top-color:var(--accent)">
      <div class="week">${days.map(x=>`<div class="wk"><div class="cols"><i class="p" style="height:${(x.planned||0)/max*96}px" title="planned ${x.planned??'?'}"></i><i class="d" style="height:${x.done/max*96}px" title="done ${x.done}"></i></div><span>${parseYmd(x.d).toLocaleDateString(undefined,{weekday:'short'})}</span><span class="mono" style="color:var(--ink)">${x.done}${x.planned!=null?'/'+x.planned:''}</span></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--line)"></i>planned</span><span><i style="background:var(--ok)"></i>done</span><span>Planned counts appear for days you closed.</span></div>
      <div class="catbars">${CATS.map(c=>{const n=wk.filter(t=>catOf(t)===c).length;return `<div class="catbar"><span>${catDot(c)} ${c}</span><div class="bar"><i style="width:${wk.length?n/wk.length*100:0}%;background:var(${CATVAR[c]})"></i></div><span class="mono" style="color:var(--muted)">${n} done</span></div>`}).join('')}</div>
    </div></section>
   <section><div class="sec-head"><h2>Weekly review</h2><span class="sub">${doneThisWeek?'Done for this week':'Week of '+fmtDate(ws)} · opens an Epic chest</span></div>
    <div class="steps">${steps.map(([a,b],i)=>`<div class="step"><input type="checkbox" id="rv-${i}" data-act="check" data-id="${i}" ${checks[i]?'checked':''}><label for="rv-${i}"><b>${a}</b><small>${esc(b)}</small></label></div>`).join('')}</div>
    <div class="outcomes">${[0,1,2].map(i=>`<input id="out-${i}" data-out="${i}" placeholder="Outcome ${i+1} for this week" value="${esc(outs[i]||'')}">`).join('')}</div>
    <div><button class="btn primary" data-act="finish-review" ${doneThisWeek?'disabled':''}>${doneThisWeek?'Review complete':'Complete review · open an Epic chest'}</button></div></section>
   <section><div class="sec-head"><h2>How the rewards work</h2></div><div class="empty-note solid" style="font-size:13.5px;line-height:1.7">
     <b>Every finished task opens a chest.</b> You never know what is inside: usually 1–2 tokens, sometimes 5 or 10, and rarely a golden ticket that buys any reward for free. Must-wins and tasks finished early roll twice and keep the better result.<br>
     <b>Combos.</b> Finish tasks within ${COMBO_MIN} minutes of each other. From the 3rd in a row, chests pay ×2. From the 5th, ×3.<br>
     <b>Daily ring.</b> Finish what you planned (at least 3) to close it and open a bonus Epic chest.<br>
     <b>Streak.</b> One empty day is a rest day. Two empty days in a row reset it. Never miss twice.<br>
     <b>Spend tokens</b> on real rewards you choose (tap your token count). The fun is earned, so enjoy it without guilt.<br>
     <span style="color:var(--muted)">${closedDays} days closed so far.</span></div></section>`}

/* ---------- coach (asks Claude, on the viewer's own account) ---------- */
let coachCtl=null;
async function runCoach(){const box=document.getElementById('coach-box');const btn=document.getElementById('coach-btn');
  let sample=null;try{sample=window.claude?.use?await window.claude.use('sample'):null}catch{}
  if(!sample){toast('The coach needs Quest Deck opened from claude.ai.');return}
  const r=dayReport();const st=stats();
  const lines=t=>`- ${t.title} [${catOf(t)||'no category'}${t.carried?`, pushed ${t.carried}x`:''}${t.due?`, due ${t.due}`:''}]`;
  const prompt=`You are a frank, warm accountability coach and behavioral psychologist. Talk to the user like a supportive friend who does not sugarcoat ("hey man" tone is fine). Write 4-6 short sentences, plain text, no lists, no headings. Name specific tasks. Say what went well, what honestly did not, the one pattern you notice, and the single smallest first step for tomorrow morning. Never shame. Today is ${r.td}.

Finished today (${r.done.length}):
${r.done.map(lines).join('\n')||'- none'}

Planned but not done (${r.openPlanned.length}):
${r.openPlanned.map(lines).join('\n')||'- none'}

Overdue overall: ${r.overdue.length}. Repeatedly pushed: ${r.slipping.map(t=>t.title).join('; ')||'none'}.
Must-wins: ${r.winsDone}/${r.wins.length}. Streak: ${st.streak} days. By category today: ${r.byCat.map(x=>`${x.c} ${x.done} done, ${x.open} open`).join('; ')}.`;
  coachCtl?.abort();coachCtl=new AbortController();btn.disabled=true;box.innerHTML='<div class="coach">Thinking…</div>';
  try{const {text}=await sample(prompt,{signal:coachCtl.signal,onText:({text})=>{box.innerHTML=`<div class="coach">${esc(text)}</div>`}});S.coach=text}
  catch(e){box.innerHTML=e.text?`<div class="coach">${esc(e.text)}</div>`:'';
    if(e.code==='not_granted'||e.code==='sampling_disabled')toast('The coach is off because Claude access was not allowed for this page.');
    else if(e.code==='rate_limited')toast('The coach is busy. Try again in a few minutes.');
    else if(e.code!=='cancelled')toast('The coach could not answer just now. Try again.')}
  finally{const b=document.getElementById('coach-btn');if(b)b.disabled=false}}

/* ---------- events ---------- */
function setView(v){S.view=v;if(v!=='projects')S.openProject=null;try{history.replaceState(null,'','#'+v)}catch{}render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{
  const vb=e.target.closest('[data-view]');if(vb&&!e.target.closest('.sheet')){setView(vb.dataset.view);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='close-sheet'){if(e.target===el)closeSheet();return}
  if(a==='close-chest'){document.getElementById('chest-root').innerHTML='';return}
  if(a==='done'){completeTask(id,e);return}
  if(a==='today'){toggleToday(id);return}
  if(a==='win'){toggleMustWin(id);return}
  if(a==='edit'){openTaskSheet(id);return}
  if(a==='del'){const t=S.tasks[id];deleteTask(id);toast(`Deleted "${esc(t.title)}"`,()=>saveTask(t));return}
  if(a==='set-cat'){const t=S.tasks[id];saveTask({...t,cat:el.dataset.cat,status:'next'});toast(`Filed to ${el.dataset.cat}`);return}
  if(a==='area'){S.area=id;S.openProject=null;try{localStorage.setItem('qd-area',id)}catch{}render();return}
  if(a==='sound'){soundOn=!soundOn;try{localStorage.setItem('qd-sound',soundOn?'on':'off')}catch{}if(soundOn)tone([660,880]);render();return}
  if(a==='rewards'){openRewardsSheet();return}
  if(a==='open-project'){S.view='projects';S.openProject=id;try{history.replaceState(null,'','#projects')}catch{}render();window.scrollTo({top:0});return}
  if(a==='close-project'){S.openProject=null;render();return}
  if(a==='new-project'){openProjectSheet(null);return}
  if(a==='new-recurring'){openTaskSheet(null,{recur:'weekly'});return}
  if(a==='edit-project'){openProjectSheet(id);return}
  if(a==='swatch'){const w=document.getElementById('p-color');w.dataset.v=id;w.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));return}
  if(a==='seg'){const w=el.closest('.seg');w.dataset.v=id;w.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));return}
  if(a==='dow'){el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')!=='true');return}
  if(a==='lucky'){const pool=openTasks().filter(inArea).filter(t=>t.status==='next'&&t.mustWinOn!==today());if(!pool.length)return;
    const t=pool[Math.random()*pool.length|0];toggleToday(t.id);tone([440,554,659]);toast(`Your next quest: <b>${esc(t.title)}</b>. Just do the first 2 minutes.`);return}
  if(a==='archive-project'){const p=S.projects[id];saveProject({...p,archived:true});closeSheet();S.openProject=null;toast(`Archived ${esc(p.name)}`,()=>saveProject({...p,archived:false}));return}
  if(a==='del-armed'){if(delArmed!==id){delArmed=id;el.textContent='Tap again to delete';return}
    const form=el.closest('form');if(form.dataset.form==='task'){const t=S.tasks[id];deleteTask(id);toast(`Deleted "${esc(t.title)}"`,()=>saveTask(t))}
    else{const p=S.projects[id];const ts=tasks().filter(t=>t.projectId===id);ts.forEach(t=>deleteTask(t.id));deleteProject(id);S.openProject=null;toast(`Deleted ${esc(p.name)} and ${ts.length} tasks`)}
    closeSheet();return}
  if(a==='check'){const ws=weekStart();const cur=S.meta.checks?.week===ws?[...(S.meta.checks.done||[])]:[];cur[+id]=el.checked;saveMeta({checks:{week:ws,done:cur}});return}
  if(a==='finish-review'){const ws=weekStart();if((S.meta.reviews||[]).some(d=>d>=ws))return;const b={at:new Date().toISOString(),tokens:15,ticket:Math.random()<.3,why:'Weekly review'};
    saveMeta({reviews:[...(S.meta.reviews||[]),today()],bonuses:[...(S.meta.bonuses||[]),b]});showChest('epic',b.tokens,b.ticket,'Weekly review done. You are ahead of next week.');burst(null,true);tone([523,659,784,1047],.14,.09);return}
  if(a==='show-report'){S.showReport=true;render();setTimeout(()=>document.getElementById('report')?.scrollIntoView({behavior:'smooth'}),50);return}
  if(a==='hide-report'){S.showReport=false;render();return}
  if(a==='tomorrow'){pushTomorrow(id);return}
  if(a==='all-tomorrow'){dayReport().openPlanned.forEach(t=>pushTomorrow(t.id));toast('Moved to tomorrow. Plan fewer, finish more.');return}
  if(a==='drop'){const t=S.tasks[id];saveTask({...t,status:'someday',todayOn:null,mustWinOn:null});toast(`Moved "${esc(t.title)}" to Someday`,()=>saveTask(t));return}
  if(a==='coach'){runCoach();return}
  if(a==='close-day'){const r=dayReport();const td=today();if(S.meta.reports?.[td]?.closed)return;
    const roll1=roll(r.plannedDone>=r.planned.length&&r.planned.length>0);const b={at:new Date().toISOString(),tokens:roll1.tokens,ticket:!!roll1.ticket,why:'Day closed'};
    saveMeta({reports:{...(S.meta.reports||{}),[td]:{planned:r.planned.length,done:r.done.length,closed:true}},bonuses:[...(S.meta.bonuses||[]),b]});
    showChest(roll1.tier,b.tokens,b.ticket,'Shutdown complete. Rest well.');chestSound(roll1.tier,1);S.showReport=true;return}
  if(a==='redeem'||a==='redeem-ticket'){const r=rewardsList().find(x=>x.id===id);if(!r)return;const st=stats();const ticket=a==='redeem-ticket';
    if(!ticket&&st.tokens<r.cost)return;if(ticket&&st.tickets<1)return;
    saveMeta({spent:[...(S.meta.spent||[]),{rewardId:r.id,name:r.name,cost:r.cost,ticket,at:new Date().toISOString()}]});
    tone([784,988,1175,1568],.14,.08);burst(null,true);toast(`<b>Enjoy it:</b> ${esc(r.name)}. You earned this.`);openRewardsSheet();return}
  if(a==='del-reward'){saveMeta({rewards:rewardsList().filter(x=>x.id!==id)});openRewardsSheet();return}
});
document.addEventListener('change',e=>{if(e.target.id==='e-recur'){const w=document.getElementById('e-days-wrap');if(w)w.hidden=e.target.value!=='custom'}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='qa'){const inp=document.getElementById('qa-input');const v=inp.value.trim();if(!v)return;
    const extra=S.view==='projects'&&S.openProject?{projectId:S.openProject}:{};const t=addFromText(v,extra);inp.value='';updatePreview();
    if(t)toast(t.status==='inbox'?`Captured to Inbox: ${esc(t.title)}`:`Added: ${esc(t.title)}${t.recur?' · '+esc(recurLabel(t)):t.due?' · '+fmtDate(t.due):''}`);return}
  if(f.dataset.form==='proj-add'){const inp=f.querySelector('input');const v=inp.value.trim();if(!v)return;addFromText(v,{projectId:f.dataset.id});inp.value='';return}
  if(f.dataset.form==='task'){const id=f.dataset.id;const t=id?S.tasks[id]:{id:'t_'+uid(),createdAt:new Date().toISOString()};const g=k=>document.getElementById(k).value;
    const status=g('e-status');const recur=g('e-recur')||null;
    const recurDays=[...document.querySelectorAll('#e-days button')].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>+b.dataset.id);
    if(recur==='custom'&&!recurDays.length){toast('Pick at least one day for this recurring task.');return}
    const n={...t,title:g('e-title').trim()||t.title||'Untitled',projectId:g('e-project')||null,cat:document.getElementById('e-cat').dataset.v||null,status,due:g('e-due')||null,warn:g('e-warn')===''?null:+g('e-warn'),
      priority:+g('e-pri'),size:g('e-size'),waitingOn:g('e-wait').trim(),recur,recurDays:recur==='custom'?recurDays:null,notes:g('e-notes')};
    if(n.recur&&!n.due)n.due=firstDue(n);
    if(status==='waiting'&&t.status!=='waiting')n.waitingSince=new Date().toISOString();
    if(id&&status==='done'&&t.status!=='done'){closeSheet();saveTask({...n,status:t.status});completeTask(t.id);return}
    if(status!=='done'&&t.status==='done'){n.doneAt=null;n.loot=null}
    if(status==='inbox'&&(n.projectId||n.due||n.cat))n.status='next';
    saveTask(n);closeSheet();if(!id)toast(`Added: ${esc(n.title)}${n.recur?' · '+esc(recurLabel(n)):''}`);return}
  if(f.dataset.form==='project'){const id=f.dataset.id;const g=k=>document.getElementById(k).value;
    const base=id?S.projects[id]:{id:'p_'+uid(),createdAt:new Date().toISOString()};
    const p={...base,name:g('p-name').trim()||'Untitled',area:document.getElementById('p-area').dataset.v||'Work',deadline:g('p-deadline')||null,goal:g('p-goal').trim(),color:document.getElementById('p-color').dataset.v};
    saveProject(p);closeSheet();if(!id){S.openProject=p.id;S.view='projects';render()}return}
  if(f.dataset.form==='reward'){const name=document.getElementById('r-name').value.trim();const cost=Math.max(1,+document.getElementById('r-cost').value||1);if(!name)return;
    saveMeta({rewards:[...rewardsList(),{id:'r_'+uid(),name,cost}]});openRewardsSheet();return}
});
let outTimer=null;
document.addEventListener('input',e=>{
  if(e.target.id==='qa-input')updatePreview();
  if(e.target.dataset.out!=null){clearTimeout(outTimer);outTimer=setTimeout(()=>{const ws=weekStart();
    saveMeta({outcomes:{week:ws,items:[0,1,2].map(i=>document.getElementById('out-'+i)?.value||'')}})},700)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();
  if(e.key==='n'&&!e.target.closest('input,textarea,select')&&!e.metaKey&&!e.ctrlKey){e.preventDefault();document.getElementById('qa-input').focus()}});
function updatePreview(){const v=document.getElementById('qa-input').value.trim();const el=document.getElementById('qa-preview');if(!v){el.textContent='';return}
  const o=parseQuick(v);const p=o.projectId?S.projects[o.projectId].name:o.newProject?`new project "${o.newProject}"`:null;
  const cat=o.projectId?catOfProject(S.projects[o.projectId]):o.cat||(S.area!=='All'?S.area:null);
  const bits=[o.status==='inbox'?'→ Inbox':o.status==='waiting'?'→ Waiting for':'→ Next action',cat,p&&'in '+p,o.recur?recurLabel(o)+' from '+fmtDate(o.due):o.due&&'due '+fmtDate(o.due),o.priority<3&&'priority '+o.priority,o.size!=='M'&&SIZE[o.size].toLowerCase()].filter(Boolean);
  el.textContent=`"${o.title}" ${bits.join(' · ')}`}

/* ---------- toast + confetti ---------- */
function toast(html,undo){const box=document.getElementById('toasts');const d=document.createElement('div');d.className='toast';
  d.innerHTML=`<span>${html}</span>${undo?'<button type="button">Undo</button>':''}`;
  if(undo)d.querySelector('button').onclick=()=>{undo();d.remove()};
  box.appendChild(d);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>d.remove(),undo?6000:3800)}
function burst(ev,big){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='fx';document.body.appendChild(c);const dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  const x=ev&&ev.clientX?ev.clientX:innerWidth/2,y=ev&&ev.clientY?ev.clientY:innerHeight/3;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);const cols=['--coin','--accent','--ok','--danger','--c5'].map(k=>cs.getPropertyValue(k).trim());
  const ps=Array.from({length:big?90:28},()=>({x,y,vx:(Math.random()-.5)*(big?14:8),vy:-Math.random()*(big?12:7)-2,s:Math.random()*5+3,c:cols[Math.random()*cols.length|0],r:Math.random()*6}));
  let f=0;(function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.98;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-f/70);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(++f<70)requestAnimationFrame(tick);else c.remove()})()}

/* ---------- boot ---------- */
function sampleData(){const td=today();const iso=new Date().toISOString();
  const P=[['p_ex1','Example: Website launch','Work','c1',addDays(td,12)],['p_ex2','Example: Home','Personal','c3',null],['p_ex3','Example: Youth night','Ministry','c5',addDays(td,9)]];
  const projects={};P.forEach(([id,name,area,color,deadline])=>projects[id]={id,name,area,color,deadline,createdAt:iso});
  const T=[['Example: Draft launch announcement','p_ex1',2,addDays(td,4),'next'],['Example: Approve final homepage copy','p_ex1',1,addDays(td,2),'next'],
    ['Example: Logo files from designer','p_ex1',2,null,'waiting'],['Example: Renew car registration','p_ex2',1,addDays(td,6),'next'],['Example: Plan the talk outline','p_ex3',2,addDays(td,5),'next'],['Example: Idea for a podcast',null,3,null,'inbox']];
  const tasks={};T.forEach(([title,projectId,priority,due,status],i)=>{const id='t_ex'+i;tasks[id]={id,title,projectId,priority,due,status,size:'M',createdAt:iso,waitingOn:status==='waiting'?'Designer':'',waitingSince:status==='waiting'?new Date(Date.now()-5*864e5).toISOString():null}});
  tasks.t_exr={id:'t_exr',title:'Example: Gym',cat:'Personal',priority:3,size:'M',status:'next',recur:'custom',recurDays:[1,3,5],due:td,createdAt:iso};
  return{projects,tasks,meta:{}}}

async function boot(){render();
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch{db=null}
  if(!db){const d=local.load()||sampleData();S.projects=d.projects||{};S.tasks=d.tasks||{};S.meta=d.meta||{};S.mode='local';render();return}
  S.db=db;const got={p:false,t:false};
  const timer=setTimeout(()=>{if(S.mode==='connecting'){S.mode='slow';render()}},10000);
  const ok=snap=>{if(!snap.metadata.fromCache&&got.p&&got.t){clearTimeout(timer);S.mode='sync'}else if(S.mode==='connecting'&&got.p&&got.t)S.mode='slow'};
  const fail=()=>{clearTimeout(timer);S.mode='slow';render();toast('Lost connection to your saved lists. Reload the page to reconnect.')};
  db.collection('projects').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});S.projects=m;got.p=true;ok(s);render()},fail);
  db.collection('tasks').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});S.tasks=m;got.t=true;ok(s);render()},fail);
  db.doc('meta/state').onSnapshot(s=>{S.meta=s.exists?{...s.data()}:{};render()},()=>{});
}

let lastKey='';setInterval(()=>{const k=today()+(new Date().getHours()>=18);if(k!==lastKey){lastKey=k;render()}},60000);lastKey=today()+(new Date().getHours()>=18);
boot();
